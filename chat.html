<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Чат 5А | Школа №15</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* ========== ТВОЙ СТИЛЬ (БЕЗ ИЗМЕНЕНИЙ) ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: url('images/fon.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }
        .chat-main-container {
            width: 1400px;
            max-width: 98vw;
            height: 90vh;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .members-panel {
            width: 280px;
            background: rgba(10, 30, 50, 0.3);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .members-header { padding: 1.5rem 1rem; font-weight: bold; color: white; background: rgba(0, 0, 0, 0.2); font-size: 1.1rem; }
        .members-list { flex: 1; list-style: none; padding: 0.5rem; }
        .member-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 0.5rem;
        }
        .member-avatar {
            width: 44px;
            height: 44px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        .member-info { flex: 1; }
        .member-name { font-weight: 600; color: white; font-size: 0.9rem; }
        .member-status { font-size: 0.7rem; opacity: 0.8; }
        .online-status { color: #4ade80; }
        .offline-status { color: #9ca3af; }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .chat-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .chat-title { font-weight: bold; color: white; font-size: 1.1rem; }
        .settings-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .date-divider { text-align: center; margin: 1rem 0; }
        .date-badge {
            display: inline-block;
            background: rgba(100, 100, 120, 0.7);
            backdrop-filter: blur(8px);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #e0e0e0;
            font-weight: 500;
        }
        .message {
            display: flex;
            gap: 0.6rem;
            align-items: flex-start;
            max-width: 80%;
            position: relative;
        }
        .message.mine {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-avatar {
            width: 32px;
            height: 32px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.7rem;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        .msg-bubble {
            background: rgba(255, 255, 255, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            color: #1e2f3e;
            position: relative;
        }
        .message.mine .msg-bubble {
            background: #0a3f6f;
            color: white;
        }
        .msg-name { font-size: 0.65rem; font-weight: bold; margin-bottom: 0.2rem; }
        .msg-text { font-size: 0.9rem; }
        .msg-text img { max-width: 200px; border-radius: 16px; margin-top: 0.3rem; transition: all 0.3s ease; }
        .msg-time { font-size: 0.6rem; opacity: 0.6; margin-top: 0.2rem; text-align: right; }
        .msg-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .status-icons {
            display: flex;
            gap: 4px;
            font-size: 12px;
        }
        .delivered { color: #4ade80; }
        .sent { color: #9ca3af; }
        .msg-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: #ccc;
            transition: 0.2s;
            padding: 0 2px;
        }
        .delete-btn:hover { color: #e94560; transform: scale(1.1); }
        .seen-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            color: #ccc;
            transition: 0.2s;
        }
        .seen-btn:hover { color: #fff; transform: scale(1.05); }
        .input-panel {
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            display: flex;
            gap: 0.6rem;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 15;
        }
        .icon-button {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 40px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .icon-button:hover { background: rgba(255,255,255,0.6); transform: scale(1.02); }
        .text-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 40px;
            padding: 0.7rem 1rem;
            font-size: 0.9rem;
            outline: none;
            color: #000 !important;
        }
        .text-input::placeholder { color: #555; }

        .modal-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }
        .modal-wrapper.active { display: flex; }
        .confirm-modal {
            background: rgba(30, 47, 62, 0.96);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            max-width: 400px;
            width: 80%;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
        }
        .confirm-modal p { color: white; margin-bottom: 1rem; }
        .confirm-modal .quote {
            background: rgba(255,255,255,0.1);
            padding: 0.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            font-style: italic;
            font-size: 0.9rem;
            color: #ddd;
        }
        .confirm-buttons { display: flex; gap: 1rem; justify-content: flex-end; }
        .confirm-buttons button {
            background: #0a3f6f;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            cursor: pointer;
        }
        .confirm-buttons button.confirm { background: #e94560; }
        .sticker-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }
        .sticker-img {
            width: 85px;
            cursor: pointer;
            background: white;
            border-radius: 20px;
            padding: 0.3rem;
            transition: 0.1s;
        }
        .sticker-img:hover { transform: scale(1.05); }
        .attach-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }
        .attach-item {
            text-align: center;
            flex: 1;
            min-width: 70px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 0.8rem 0.5rem;
            transition: 0.2s;
        }
        .attach-item:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        .attach-icon {
            font-size: 2.2rem;
            filter: grayscale(100%);
            opacity: 0.7;
            transition: 0.1s;
        }
        .attach-icon:hover { opacity: 1; transform: scale(1.05); }
        .attach-label {
            font-size: 0.7rem;
            color: #e0e0e0;
            margin-top: 0.3rem;
            font-weight: 500;
        }
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .photo-item {
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }
        .photo-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 16px;
        }
        .photo-number {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #e94560;
            color: white;
            border-radius: 20px;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            z-index: 2;
        }
        .camera-round-btn {
            background: #2e7d64;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .camera-round-btn:hover { transform: scale(1.05); background: #3e9a7a; }
        .attach-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .back-btn {
            background: #0a3f6f;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .style-btn {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 40px;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .style-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }
        .empty-photo {
            text-align: center;
            padding: 1rem;
            background: rgba(255,255,255,0.15);
            border-radius: 28px;
            backdrop-filter: blur(8px);
            color: #ccc;
            font-size: 0.8rem;
        }
        .seen-modal-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .seen-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .seen-avatar {
            width: 32px;
            height: 32px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .loading-spinner-overlay {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="chat-main-container">
    <div class="members-panel">
        <div class="members-header">👥 Участники 5А</div>
        <ul class="members-list" id="membersList"></ul>
    </div>
    <div class="chat-area" id="chatArea">
        <div class="chat-header">
            <span class="chat-title">💬 Общий чат 5 «А»</span>
            <button class="settings-btn" id="settingsBtn">⚙️ Настройки</button>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="input-panel">
            <button class="icon-button" id="stickerBtn">😊</button>
            <input type="text" class="text-input" id="messageInput" placeholder="Сообщение...">
            <button class="icon-button" id="attachBtn">📎</button>
            <button class="icon-button" id="sendBtn">➤</button>
        </div>

        <div class="modal-wrapper" id="deleteConfirmModal">
            <div class="confirm-modal">
                <p>🗑️ Вы действительно хотите удалить сообщение?</p>
                <div class="quote" id="deleteQuote"></div>
                <div class="confirm-buttons">
                    <button id="cancelDeleteBtn">Отмена</button>
                    <button id="confirmDeleteBtn" class="confirm">Удалить</button>
                </div>
            </div>
        </div>

        <div class="modal-wrapper" id="stickerWrapper">
            <div class="modal" id="stickerModal">
                <div class="modal-handle" id="stickerHandle"></div>
                <div class="modal-content-inner" id="stickerModalContent"></div>
            </div>
        </div>

        <div class="modal-wrapper" id="attachWrapper">
            <div class="modal" id="attachModal">
                <div class="modal-handle" id="attachHandle"></div>
                <div class="modal-content-inner" id="attachModalContent"></div>
            </div>
        </div>

        <div class="modal-wrapper" id="seenWrapper">
            <div class="modal" id="seenModal">
                <div class="modal-handle" id="seenHandle"></div>
                <div class="modal-content-inner" id="seenModalContent"></div>
            </div>
        </div>
    </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUser = null;
    let messagesUnsub = null;
    const CHAT_PATH = 'class5a_chat';
    const usersCache = new Map();
    let selectedImages = [];
    let attachScreen = 'main';
    let pendingMessages = new Map();
    let pendingDelete = { msgId: null, msgUid: null, messageText: null };

    console.log('✅ Чат инициализирован');
    console.log('🔍 Ищем кнопки:', {
        sticker: document.getElementById('stickerBtn'),
        attach: document.getElementById('attachBtn'),
        send: document.getElementById('sendBtn'),
        settings: document.getElementById('settingsBtn')
    });

    function formatDateLabel(date) {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        if (msgDate.getTime() === today.getTime()) return 'Сегодня';
        if (msgDate.getTime() === yesterday.getTime()) return 'Вчера';
        return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit' });
    }

    function getAvatarHtml(avatarBase64, name) {
        if (avatarBase64 && avatarBase64.startsWith('data:image')) return `<img src="${avatarBase64}" style="width:100%; height:100%; object-fit:cover;">`;
        return (name?.charAt(0) || '?').toUpperCase();
    }

    async function getUserData(uid) {
        if (usersCache.has(uid)) return usersCache.get(uid);
        const doc = await db.collection('users').doc(uid).get();
        const data = doc.data() || { name: 'Ученик', avatarBase64: null };
        usersCache.set(uid, data);
        return data;
    }

    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        currentUser = user;
        await db.collection('status').doc(user.uid).set({ online: true, name: user.displayName || 'Ученик' }, { merge: true });
        loadMessages();
        loadMembers();
        window.addEventListener('beforeunload', () => {
            db.collection('status').doc(user.uid).set({ online: false }, { merge: true });
        });
    });

    async function markAsSeen(msgId) {
        const msgRef = db.collection('rooms').doc(CHAT_PATH).collection('messages').doc(msgId);
        await msgRef.update({ seenBy: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
    }

    function showDeleteConfirm(msgId, msgUid, messageText) {
        pendingDelete = { msgId, msgUid, messageText };
        document.getElementById('deleteQuote').textContent = messageText.length > 100 ? messageText.substring(0, 100) + '…' : messageText;
        document.getElementById('deleteConfirmModal').classList.add('active');
    }

    document.getElementById('cancelDeleteBtn').onclick = () => {
        document.getElementById('deleteConfirmModal').classList.remove('active');
        pendingDelete = { msgId: null, msgUid: null, messageText: null };
    };
    document.getElementById('confirmDeleteBtn').onclick = async () => {
        const modal = document.getElementById('deleteConfirmModal');
        modal.classList.remove('active');
        if (!pendingDelete.msgId) return;
        const isMine = pendingDelete.msgUid === currentUser.uid;
        let canDelete = isMine;
        if (!isMine) {
            const password = prompt('🔐 Это чужое сообщение. Введите пароль модератора:');
            if (password !== 'КИКИ99СССР') {
                alert('Неверный пароль! Удаление отменено.');
                pendingDelete = { msgId: null, msgUid: null, messageText: null };
                return;
            }
            canDelete = true;
        }
        if (canDelete) {
            await db.collection('rooms').doc(CHAT_PATH).collection('messages').doc(pendingDelete.msgId).delete();
        }
        pendingDelete = { msgId: null, msgUid: null, messageText: null };
    };

    function loadMessages() {
        if (messagesUnsub) messagesUnsub();
        messagesUnsub = db.collection('rooms').doc(CHAT_PATH).collection('messages').orderBy('createdAt').onSnapshot(async (snap) => {
            snap.docChanges().forEach(change => {
                const m = change.doc.data();
                if (change.type === 'added' && m.uid !== currentUser.uid) {
                    if (!m.seenBy || !m.seenBy.includes(currentUser.uid)) markAsSeen(change.doc.id);
                }
            });
            
            const messages = [];
            for (const doc of snap.docs) messages.push({ id: doc.id, ...doc.data() });
            
            let lastDate = null;
            const container = document.getElementById('messagesArea');
            container.innerHTML = '';
            for (const m of messages) {
                const msgDate = m.createdAt?.toDate();
                if (msgDate) {
                    const dateLabel = formatDateLabel(msgDate);
                    if (dateLabel !== lastDate) {
                        const divider = document.createElement('div');
                        divider.className = 'date-divider';
                        divider.innerHTML = `<div class="date-badge">${dateLabel}</div>`;
                        container.appendChild(divider);
                        lastDate = dateLabel;
                    }
                }
                const mine = m.uid === currentUser?.uid;
                const userData = await getUserData(m.uid);
                const avatarHtml = getAvatarHtml(userData.avatarBase64, userData.name || m.name);
                let mediaHtml = '';
                if (m.images && m.images.length) mediaHtml = `<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:4px; max-width:260px;">${m.images.map(img => `<img src="${img}" style="width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px;">`).join('')}</div>`;
                else if (m.image) mediaHtml = `<img src="${m.image}" style="max-width:200px; border-radius:16px;">`;
                if (m.sticker) mediaHtml += `<img src="${m.sticker}" style="max-width:130px">`;
                const seenCount = (m.seenBy || []).filter(uid => uid !== m.uid).length;
                const statusHtml = seenCount > 0 ? '<span class="delivered">✅✅</span>' : '<span class="sent">⌛</span>';
                const div = document.createElement('div');
                div.className = `message ${mine ? 'mine' : ''}`;
                div.id = m.id;
                div.innerHTML = `<div class="msg-avatar">${avatarHtml}</div><div class="msg-bubble"><div class="msg-name">${userData.name || m.name || 'Ученик'}</div><div class="msg-text">${mediaHtml} ${m.text || ''}</div><div class="msg-footer"><div class="status-icons">${statusHtml}</div><div class="msg-actions"><button class="delete-btn" data-msg-id="${m.id}" data-msg-uid="${m.uid}" data-msg-text="${escapeHtml(m.text || 'Фото/стикер')}">🗑️</button><button class="seen-btn" data-msg-id="${m.id}">👁️</button></div></div><div class="msg-time">${m.createdAt?.toDate().toLocaleTimeString() || ''}</div></div>`;
                container.appendChild(div);
                div.querySelector('.delete-btn')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showDeleteConfirm(m.id, m.uid, m.text || 'Фото/стикер');
                });
                div.querySelector('.seen-btn')?.addEventListener('click', (e) => showSeenModal(m.id, m.seenBy || []));
            }
            
            for (let [tempId, pending] of pendingMessages.entries()) {
                if (!document.getElementById(tempId)) {
                    const userData = await getUserData(currentUser.uid);
                    const avatarHtml = getAvatarHtml(userData.avatarBase64, userData.name);
                    let mediaHtml = '';
                    if (pending.images?.length) {
                        mediaHtml = `<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:4px; max-width:260px;">`;
                        for (let img of pending.images) mediaHtml += `<div class="loading-spinner-overlay" style="position:relative; display:block; width:100%; aspect-ratio:1;"><img src="${img}" style="width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px; filter: brightness(0.5) blur(4px);"><div class="spinner"></div></div>`;
                        mediaHtml += `</div>`;
                    }
                    const div = document.createElement('div');
                    div.className = 'message mine';
                    div.id = tempId;
                    div.innerHTML = `<div class="msg-avatar">${avatarHtml}</div><div class="msg-bubble"><div class="msg-name">${userData.name || currentUser.displayName || 'Ученик'}</div><div class="msg-text">${mediaHtml} ${pending.text || ''}</div><div class="msg-footer"><div class="status-icons"><span class="sent">⌛</span></div></div><div class="msg-time">отправляется...</div></div>`;
                    container.appendChild(div);
                }
            }
            container.scrollTop = container.scrollHeight;
        });
    }

    async function loadMembers() {
        db.collection('status').onSnapshot(async (snap) => {
            const container = document.getElementById('membersList');
            container.innerHTML = '';
            for (const doc of snap.docs) {
                const status = doc.data();
                const userData = await getUserData(doc.id);
                const avatarHtml = getAvatarHtml(userData.avatarBase64, userData.name);
                container.innerHTML += `<li class="member-item"><div class="member-avatar">${avatarHtml}</div><div class="member-info"><div class="member-name">${userData.name || status.name || 'Ученик'}</div><div class="member-status ${status.online ? 'online-status' : 'offline-status'}">${status.online ? '🟢 Онлайн' : '⚫ Офлайн'}</div></div></li>`;
            }
        });
    }

    async function sendMessageOptimistic(text, imagesArray, stickerUrl = null) {
        const tempId = 'temp_' + Date.now() + '_' + Math.random();
        const userData = await getUserData(currentUser.uid);
        pendingMessages.set(tempId, { text: text || '', images: imagesArray || [] });
        loadMessages();
        try {
            await db.collection('rooms').doc(CHAT_PATH).collection('messages').add({
                text: text || '', images: imagesArray || [], sticker: stickerUrl,
                uid: currentUser.uid, name: userData.name || currentUser.displayName || 'Ученик',
                seenBy: [currentUser.uid], createdAt: new Date()
            });
            pendingMessages.delete(tempId);
            loadMessages();
        } catch (err) {
            pendingMessages.delete(tempId);
            loadMessages();
            alert('Ошибка отправки');
        }
    }

    async function showSeenModal(msgId, seenByArray) {
        const modal = document.getElementById('seenModal');
        const content = document.getElementById('seenModalContent');
        const users = [];
        for (const uid of seenByArray) if (uid !== currentUser?.uid) {
            const userData = await getUserData(uid);
            users.push(userData.name || 'Ученик');
        }
        content.innerHTML = `<div class="modal-title">👁️ Просмотрено</div><div class="seen-modal-list"><div class="seen-item"><div class="seen-avatar">📖</div><span>${users.length ? users.join(', ') : 'Никто, кроме вас'}</span></div></div><button class="close-btn" id="seenCloseBtn">Закрыть</button>`;
        modal.classList.add('active');
        document.getElementById('seenCloseBtn').onclick = () => modal.classList.remove('active');
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, (m) => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

    function renderStickerModal() {
        console.log('🎨 renderStickerModal вызван');
        try {
            const container = document.getElementById('stickerModalContent');
            if (!container) { console.error('❌ Контейнер stickerModalContent не найден'); return; }
            container.innerHTML = `<div class="modal-title">✨ Стикеры</div><div id="stickerList" class="sticker-grid"></div><button class="close-btn" id="stickerModalCloseBtn">Закрыть</button>`;
            const stickers = ['stickers/okay.gif'];
            const stickerContainer = document.getElementById('stickerList');
            if (stickerContainer) {
                stickerContainer.innerHTML = stickers.map(s => `<img src="${s}" class="sticker-img" data-sticker-url="${s}">`).join('');
                document.querySelectorAll('#stickerList .sticker-img').forEach(img => {
                    img.onclick = (e) => {
                        e.stopPropagation();
                        const url = img.getAttribute('data-sticker-url');
                        console.log('📤 Отправка стикера:', url);
                        sendMessageOptimistic('', null, url);
                        closeModal('stickerModal', 'stickerModalContent');
                    };
                });
            }
            const closeBtn = document.getElementById('stickerModalCloseBtn');
            if (closeBtn) closeBtn.onclick = (e) => { e.preventDefault(); closeModal('stickerModal', 'stickerModalContent'); };
            console.log('✅ Стикеры отрендерены');
        } catch (err) { console.error('🔥 Ошибка в renderStickerModal:', err); }
    }

    function renderAttachMain() {
        console.log('📎 renderAttachMain вызван');
        try {
            const container = document.getElementById('attachModalContent');
            if (!container) { console.error('❌ Контейнер attachModalContent не найден'); return; }
            container.innerHTML = `
                <div class="modal-title">📎 Отправить</div>
                <div class="attach-grid">
                    <div class="attach-item" data-type="camera"><div class="attach-icon">📷</div><div class="attach-label">Камера</div></div>
                    <div class="attach-item" data-type="video"><div class="attach-icon">🎥</div><div class="attach-label">Видео</div></div>
                    <div class="attach-item" data-type="file"><div class="attach-icon">📄</div><div class="attach-label">Файл</div></div>
                    <div class="attach-item" data-type="poll"><div class="attach-icon">📊</div><div class="attach-label">Опрос</div></div>
                    <div class="attach-item" data-type="voice"><div class="attach-icon">🎤</div><div class="attach-label">Голос</div></div>
                    <div class="attach-item" data-type="link"><div class="attach-icon">🔗</div><div class="attach-label">Ссылка</div></div>
                </div>
                <button class="close-btn" id="attachModalCloseBtn">Закрыть</button>
            `;
            document.querySelectorAll('.attach-item').forEach(el => {
                el.onclick = (e) => {
                    e.stopPropagation();
                    if (el.dataset.type === 'camera') {
                        attachScreen = 'camera';
                        renderCameraScreen();
                    } else {
                        alert(`📎 Отправка ${el.dataset.type} — в разработке`);
                        closeModal('attachModal', 'attachModalContent');
                        attachScreen = 'main';
                    }
                };
            });
            const closeBtn = document.getElementById('attachModalCloseBtn');
            if (closeBtn) closeBtn.onclick = (e) => { closeModal('attachModal', 'attachModalContent'); attachScreen = 'main'; };
            console.log('✅ Меню скрепки отрендерено');
        } catch (err) { console.error('🔥 Ошибка в renderAttachMain:', err); }
    }

    function renderCameraScreen() {
        const container = document.getElementById('attachModalContent');
        if (!container) return;
        container.innerHTML = `
            <div class="attach-header"><button class="back-btn" id="cameraBackBtn">← Назад</button><div class="modal-title">Снять фото</div><button class="camera-round-btn" id="openCameraBtn">📷</button></div>
            <div id="photoGallery" class="photo-gallery"></div>
            <div style="display: flex; gap: 10px; margin-top: 10px;"><button class="style-btn" id="selectFromGalleryBtn" style="flex:1;">📁 Выбрать из галереи</button></div>
            <button class="close-btn" id="attachModalCloseBtn" style="margin-top:10px;">Закрыть</button>
        `;
        renderPhotoGallery();
        document.getElementById('cameraBackBtn').onclick = () => { attachScreen = 'main'; renderAttachMain(); };
        document.getElementById('openCameraBtn').onclick = () => showCameraModal();
        document.getElementById('selectFromGalleryBtn').onclick = () => {
            const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
            input.onchange = (e) => { if (e.target.files) addFiles(e.target.files); input.remove(); };
            input.click();
        };
        document.getElementById('attachModalCloseBtn').onclick = (e) => { closeModal('attachModal', 'attachModalContent'); attachScreen = 'main'; };
    }

    function renderPhotoGallery() {
        const gallery = document.getElementById('photoGallery');
        if (!gallery) return;
        if (!selectedImages.length) {
            gallery.innerHTML = '<div class="empty-photo">😕 Нет выбранных фото</div>';
            return;
        }
        gallery.innerHTML = '';
        for (let i=0; i<selectedImages.length; i++) {
            const div = document.createElement('div'); div.className = 'photo-item';
            const img = document.createElement('img'); img.src = selectedImages[i];
            div.appendChild(img);
            const numberSpan = document.createElement('div'); numberSpan.className = 'photo-number'; numberSpan.textContent = i+1;
            div.appendChild(numberSpan);
            div.onclick = () => { selectedImages.splice(i,1); renderPhotoGallery(); };
            gallery.appendChild(div);
        }
    }

    function addFiles(files) {
        const newFiles = Array.from(files);
        const remaining = 8 - selectedImages.length;
        const toAdd = newFiles.slice(0, remaining);
        for (const file of toAdd) {
            const reader = new FileReader();
            reader.onload = (e) => { selectedImages.push(e.target.result); renderPhotoGallery(); };
            reader.readAsDataURL(file);
        }
        if (newFiles.length > remaining) alert(`Можно выбрать до 8 фото. Добавлено ${remaining}.`);
    }

    function showCameraModal() {
        const origContent = document.getElementById('attachModalContent').innerHTML;
        document.getElementById('attachModalContent').innerHTML = `
            <div class="preview-header" style="display:flex; justify-content:space-between; margin-bottom:1rem;"><button class="back-btn" id="cameraBackBtn" style="background:#0a3f6f;">← Назад</button><span class="modal-title">Снять фото</span><button class="rotate-btn" id="rotateCameraBtn" style="background:#0a3f6f;">🔄</button></div>
            <video id="cameraVideo" autoplay playsinline style="width:100%; border-radius:24px; background:#000;"></video>
            <div class="camera-controls" style="display:flex; justify-content:center; gap:1rem; margin-top:1rem;"><button class="shutter-btn" id="captureBtn" style="background:white; border:none; width:60px; height:60px; border-radius:50%; font-size:1.8rem;">📸</button></div>
            <button class="close-btn" id="cameraCloseBtn">Закрыть</button>
        `;
        let facingMode = 'environment', stream = null;
        const startCamera = async () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: facingMode } } }); }
            catch { try { stream = await navigator.mediaDevices.getUserMedia({ video: true }); } catch(e) { alert('Нет доступа к камере'); return; } }
            document.getElementById('cameraVideo').srcObject = stream;
        };
        startCamera();
        document.getElementById('cameraBackBtn').onclick = () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('attachModalContent').innerHTML = origContent; renderPhotoGallery();
            document.getElementById('openCameraBtn').onclick = () => showCameraModal();
            document.getElementById('selectFromGalleryBtn').onclick = () => {
                const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
                input.onchange = (e) => { if (e.target.files) addFiles(e.target.files); input.remove(); };
                input.click();
            };
        };
        document.getElementById('rotateCameraBtn').onclick = () => { facingMode = facingMode === 'environment' ? 'user' : 'environment'; startCamera(); };
        document.getElementById('captureBtn').onclick = () => {
            const video = document.getElementById('cameraVideo');
            if (!video) return;
            const canvas = document.createElement('canvas'); canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const dataUrl = canvas.toDataURL('image/jpeg');
            if (selectedImages.length < 8) { selectedImages.push(dataUrl); renderPhotoGallery(); }
            else alert('Максимум 8 фото');
        };
        document.getElementById('cameraCloseBtn').onclick = () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('attachModalContent').innerHTML = origContent; renderPhotoGallery();
            document.getElementById('openCameraBtn').onclick = () => showCameraModal();
            document.getElementById('selectFromGalleryBtn').onclick = () => {
                const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
                input.onchange = (e) => { if (e.target.files) addFiles(e.target.files); input.remove(); };
                input.click();
            };
        };
    }

    function closeModal(modalId, contentId) {
        const modal = document.getElementById(modalId);
        if (!modal) return;
        modal.classList.remove('active');
        setTimeout(() => { const container = document.getElementById(contentId); if (container) container.innerHTML = ''; }, 300);
    }

    function initSwipeClose(modalId, handleId, contentId) {
        const modal = document.getElementById(modalId);
        const handle = document.getElementById(handleId);
        if (!modal || !handle) return;
        let startY=0, startTransform=0, dragging=false;
        handle.addEventListener('touchstart', (e) => { startY=e.touches[0].clientY; const t=modal.style.transform; if(t && t.includes('translateY')) startTransform=parseFloat(t.match(/translateY\(([-\d]+)px\)/)?.[1]||0); dragging=true; });
        handle.addEventListener('touchmove', (e) => { if(!dragging) return; const delta=e.touches[0].clientY-startY; if(delta>0){ modal.style.transform=`translateY(${startTransform+delta}px)`; modal.style.opacity='0.7'; } });
        handle.addEventListener('touchend', (e) => { if(!dragging) return; const delta=e.changedTouches[0].clientY-startY; if(delta>80) closeModal(modalId, contentId); modal.style.transform=''; modal.style.opacity=''; dragging=false; });
        let mouseDown=false, mouseStartY=0;
        handle.addEventListener('mousedown', (e) => { mouseDown=true; mouseStartY=e.clientY; e.preventDefault(); });
        window.addEventListener('mousemove', (e) => { if(!mouseDown) return; const delta=e.clientY-mouseStartY; if(delta>0){ modal.style.transform=`translateY(${delta}px)`; modal.style.opacity='0.7'; } });
        window.addEventListener('mouseup', (e) => { if(!mouseDown) return; const delta=e.clientY-mouseStartY; if(delta>80) closeModal(modalId, contentId); modal.style.transform=''; modal.style.opacity=''; mouseDown=false; });
    }

    initSwipeClose('stickerModal', 'stickerHandle', 'stickerModalContent');
    initSwipeClose('attachModal', 'attachHandle', 'attachModalContent');
    initSwipeClose('seenModal', 'seenHandle', 'seenModalContent');

    // === ПРИВЯЗКА КНОПОК С ЛОГАМИ ===
    const stickerBtn = document.getElementById('stickerBtn');
    if (stickerBtn) {
        stickerBtn.onclick = () => {
            console.log('😊 Нажата кнопка стикеров');
            try {
                renderStickerModal();
                const modal = document.getElementById('stickerModal');
                if (modal) {
                    modal.classList.add('active');
                    console.log('✅ Модалка стикеров открыта');
                } else {
                    console.error('❌ Модалка стикеров не найдена');
                }
            } catch (err) {
                console.error('🔥 Ошибка при открытии стикеров:', err);
            }
        };
    } else {
        console.error('❌ Кнопка stickerBtn не найдена в DOM');
    }

    const attachBtn = document.getElementById('attachBtn');
    if (attachBtn) {
        attachBtn.onclick = () => {
            console.log('📎 Нажата кнопка скрепки');
            try {
                attachScreen = 'main';
                selectedImages = [];
                renderAttachMain();
                const modal = document.getElementById('attachModal');
                if (modal) {
                    modal.classList.add('active');
                    console.log('✅ Модалка скрепки открыта');
                } else {
                    console.error('❌ Модалка скрепки не найдена');
                }
            } catch (err) {
                console.error('🔥 Ошибка при открытии скрепки:', err);
            }
        };
    } else {
        console.error('❌ Кнопка attachBtn не найдена в DOM');
    }

    document.getElementById('sendBtn').onclick = async () => {
        const text = document.getElementById('messageInput').value;
        if (selectedImages.length) {
            await sendMessageOptimistic(text, [...selectedImages]);
            selectedImages = [];
            document.getElementById('messageInput').value = '';
            attachScreen = 'main';
            closeModal('attachModal', 'attachModalContent');
        } else if (text.trim()) {
            await sendMessageOptimistic(text, null);
            document.getElementById('messageInput').value = '';
        }
    };
    document.getElementById('settingsBtn').onclick = () => window.location.href = 'settings.html';
</script>
