<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Широкий чат 5А</title>
    <style>
        /* ======== НАСТРОЙКИ ШИРИНЫ (меняй здесь) ======== */
        body { margin: 0; background: #cceef8; height: 100vh; display: flex; }
        .chat { width: 100%; display: flex; flex-direction: column; background: rgba(255,255,255,0.3); }
        .main { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: rgba(255,255,255,0.3); padding: 1rem; }
        .messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        /* остальное не трогай — оно работает */
        .message { display: flex; gap: 0.5rem; max-width: 70%; }
        .message.mine { align-self: flex-end; flex-direction: row-reverse; }
        .avatar { width: 36px; height: 36px; background: #0a3f6f; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; }
        .bubble { background: white; padding: 0.3rem 0.8rem; border-radius: 20px; }
        .mine .bubble { background: #d9f0ff; }
        .input-bar { display: flex; gap: 0.5rem; padding: 0.5rem; background: rgba(255,255,255,0.5); }
        .input-bar input { flex: 1; border-radius: 40px; border: none; padding: 0.5rem 1rem; }
        button { background: #0a3f6f; color: white; border: none; border-radius: 40px; padding: 0.3rem 1rem; cursor: pointer; }
        .auth-card { max-width: 400px; margin: 2rem auto; background: white; padding: 1.5rem; border-radius: 24px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div id="auth" class="auth-card">
    <h3>Вход / Регистрация</h3>
    <input type="text" id="name" placeholder="Имя"><br>
    <input type="email" id="email" placeholder="Email"><br>
    <input type="password" id="pass" placeholder="Пароль"><br>
    <button id="loginBtn">Войти</button>
    <button id="regBtn">Зарегистрироваться</button>
</div>
<div id="chat" class="chat hidden">
    <div style="background: rgba(255,255,255,0.4); padding: 0.5rem 1rem;">💬 Чат 5А <a href="index.html" style="float:right;">🏠</a></div>
    <div class="main">
        <div class="sidebar">
            <div><span id="avatar">😎</span> <input id="profileName" placeholder="Имя"> <button id="save">💾</button></div>
            <hr><b>Участники</b><div id="members"></div>
        </div>
        <div class="messages" id="messagesList"></div>
    </div>
    <div class="input-bar">
        <input id="msgInput" placeholder="Сообщение...">
        <button id="send">➤</button>
    </div>
</div>
<script src="js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
let currentUser, unsub;
auth.onAuthStateChanged(user => {
    if(user){
        currentUser = user;
        document.getElementById('auth').classList.add('hidden');
        document.getElementById('chat').classList.remove('hidden');
        document.getElementById('profileName').value = user.displayName || '';
        document.getElementById('avatar').textContent = user.photoURL || '😎';
        if(unsub) unsub();
        unsub = db.collection('rooms').doc(CHAT_ROOM_ID).collection('messages').orderBy('createdAt').onSnapshot(snap => {
            const cont = document.getElementById('messagesList');
            cont.innerHTML = '';
            snap.forEach(doc => {
                const d = doc.data();
                const isMine = d.uid === currentUser.uid;
                cont.innerHTML += `<div class="message ${isMine ? 'mine' : ''}">
                    <div class="avatar">${d.avatar || '😎'}</div>
                    <div class="bubble"><b>${escapeHtml(d.displayName)}</b><br>${d.sticker ? `<img src="${d.sticker}" style="max-width:100px">` : escapeHtml(d.text)}<div style="font-size:0.6rem">${d.createdAt ? new Date(d.createdAt.toDate()).toLocaleTimeString().slice(0,5) : ''}</div></div>
                </div>`;
            });
            cont.scrollTop = cont.scrollHeight;
        });
        document.getElementById('members').innerHTML = `<div>👤 ${user.displayName || user.email}</div>`;
    } else {
        document.getElementById('auth').classList.remove('hidden');
        document.getElementById('chat').classList.add('hidden');
    }
});
function escapeHtml(s){ return s?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]) || ''; }
document.getElementById('loginBtn').onclick = () => auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('pass').value);
document.getElementById('regBtn').onclick = () => auth.createUserWithEmailAndPassword(document.getElementById('email').value, document.getElementById('pass').value).then(cred => cred.user.updateProfile({ displayName: document.getElementById('name').value, photoURL: '😎' }));
document.getElementById('send').onclick = async () => {
    const inp = document.getElementById('msgInput');
    if(!inp.value.trim()) return;
    await db.collection('rooms').doc(CHAT_ROOM_ID).collection('messages').add({ uid: currentUser.uid, displayName: currentUser.displayName, avatar: currentUser.photoURL || '😎', text: inp.value, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    inp.value = '';
};
document.getElementById('save').onclick = async () => {
    await currentUser.updateProfile({ displayName: document.getElementById('profileName').value, photoURL: document.getElementById('avatar').textContent });
    alert('Сохранено');
};
</script>
</body>
</html>
