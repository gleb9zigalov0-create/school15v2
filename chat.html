<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Мега-чат 5А | Школа №15</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="theme-chat.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ВЕСЬ ФОН СТРАНИЦЫ — ГОЛУБОЙ */
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: linear-gradient(145deg, #b0dff5 0%, #cceef8 100%);
            min-height: 100vh;
            padding: 1rem;
        }

        .chat-glass {
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            height: calc(100vh - 2rem);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .chat-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .chat-header h1 { color: #0a3f6f; font-size: 1.5rem; }
        .online-count { background: #e94560; color: white; padding: 0.2rem 0.8rem; border-radius: 40px; font-size: 0.8rem; }
        .back-btn { background: rgba(255,255,255,0.6); padding: 0.3rem 1rem; border-radius: 40px; text-decoration: none; color: #0a3f6f; font-weight: bold; }

        .chat-main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ЛЕВАЯ ПАНЕЛЬ — ГОЛУБАЯ */
        .members-panel {
            width: 280px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(8px);
            border-right: 1px solid rgba(255,255,255,0.4);
            overflow-y: auto;
            padding: 1rem;
            flex-shrink: 0;
        }
        .member-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem;
            border-radius: 32px;
            margin-bottom: 0.3rem;
        }
        .member-avatar {
            width: 44px;
            height: 44px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1rem;
        }
        .member-info { flex: 1; }
        .member-name { font-weight: bold; color: #0a2a44; }
        .member-status { font-size: 0.7rem; color: #2c5a7a; }

        /* ОБЛАСТЬ СООБЩЕНИЙ — ТОЛЬКО ЗДЕСЬ ФОН С КАРТИНКОЙ */
        .messages-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: url('images/fon.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ЛЕНТА СООБЩЕНИЙ (поверх картинки, но с полупрозрачным слоем) */
        .messages-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: rgba(255, 255, 255, 0.15);
        }

        /* ПУЗЫРЬКИ СООБЩЕНИЙ */
        .message {
            display: flex;
            gap: 0.6rem;
            max-width: 70%;
        }
        .message.mine { align-self: flex-end; flex-direction: row-reverse; }
        .message-avatar {
            width: 36px;
            height: 36px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .message-bubble {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 0.5rem 1rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .message.mine .message-bubble { background: rgba(217, 240, 255, 0.95); }
        .message-name { font-weight: bold; font-size: 0.75rem; color: #0a3f6f; margin-bottom: 0.2rem; }
        .message-text { font-size: 0.9rem; color: #1e2f3e; word-break: break-word; }
        .message-time { font-size: 0.6rem; color: #94a3b8; margin-top: 0.2rem; text-align: right; }
        .message-sticker { max-width: 150px; border-radius: 20px; }

        /* ПОЛЕ ВВОДА — ГОЛУБОЕ */
        .input-area {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            padding: 0.8rem 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.4);
        }
        .input-area input {
            flex: 1;
            background: rgba(255,255,255,0.8);
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
        }
        .icon-btn {
            background: rgba(255,255,255,0.7);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
        }
        .icon-btn:hover { background: #0a3f6f; color: white; }

        .stickers-panel {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 1rem;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            max-width: 90vw;
            border: 1px solid white;
            z-index: 1000;
        }
        .sticker-img {
            width: 80px;
            cursor: pointer;
            border-radius: 20px;
            padding: 0.3rem;
            background: white;
        }
        .sticker-img:hover { transform: scale(1.05); }

        .hidden { display: none; }
        .auth-box { text-align: center; padding: 2rem; background: rgba(255,255,255,0.4); border-radius: 48px; margin: 2rem; }
        .auth-box input { margin: 0.5rem auto; display: block; width: 80%; max-width: 300px; padding: 0.6rem; border-radius: 40px; border: none; }
    </style>
</head>
<body class="page-chat">

<div class="chat-deco" aria-hidden="true">
    <div class="msg-cube mc1"></div>
    <div class="msg-cube mc2"></div>
    <div class="msg-cube mc3"></div>
</div>

<div class="chat-glass">
    <div class="chat-header">
        <h1>💬 Мега-чат 5 «А»</h1>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <span class="online-count" id="onlineCount">👥 0</span>
            <a href="index.html" class="back-btn">← На главную</a>
        </div>
    </div>

    <div id="authContainer" class="auth-box">
        <h2>🔐 Вход в чат</h2>
        <button id="googleLoginBtn" class="btn btn-google" style="background:#0a3f6f; color:white; border:none; padding:0.8rem 1.5rem; border-radius:40px; margin:1rem;">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" style="width:20px; margin-right:8px;">
            Войти через Google
        </button>
        <p style="margin:1rem">или</p>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Пароль">
        <button id="emailLoginBtn" class="btn btn-primary">Войти</button>
        <p style="margin-top:1rem">Нет аккаунта? <button id="showRegisterBtn" style="background:none; border:none; color:#0a3f6f; font-weight:bold;">Зарегистрироваться</button></p>
    </div>

    <div id="chatContainer" class="hidden" style="display: flex; flex: 1; overflow: hidden;">
        <div class="members-panel" id="membersPanel">
            <h3 style="color:#0a3f6f; margin-bottom:1rem">📋 Участники</h3>
            <div id="membersList"></div>
        </div>
        <div class="messages-area">
            <div class="messages-list" id="messagesList"></div>
            <div class="input-area">
                <button class="icon-btn" id="stickerBtn">😊</button>
                <input type="text" id="messageInput" placeholder="Сообщение для класса…">
                <button class="icon-btn" id="attachBtn">📎</button>
                <button class="icon-btn" id="sendBtn">➤</button>
            </div>
        </div>
    </div>
</div>

<div id="stickersPanel" class="stickers-panel hidden"></div>

<script src="js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
    let auth, db;
    let currentUser = null;
    let unsubscribeMessages = null;

    async function loadStickers() {
        const panel = document.getElementById('stickersPanel');
        const stickerFiles = ['okay.gif'];
        panel.innerHTML = '';
        for (let file of stickerFiles) {
            const img = document.createElement('img');
            img.src = `stickers/${file}`;
            img.className = 'sticker-img';
            img.onclick = () => sendSticker(`stickers/${file}`);
            panel.appendChild(img);
        }
    }

    function sendSticker(url) {
        if (!currentUser) return;
        db.collection('rooms').doc(CHAT_ROOM_ID).collection('messages').add({
            uid: currentUser.uid,
            displayName: currentUser.displayName || currentUser.email.split('@')[0],
            sticker: url,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('stickersPanel').classList.add('hidden');
    }

    function renderMessage(doc) {
        const data = doc.data();
        const isMine = data.uid === currentUser?.uid;
        const div = document.createElement('div');
        div.className = `message ${isMine ? 'mine' : 'other'}`;
        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.textContent = (data.displayName || '?')[0].toUpperCase();
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.innerHTML = `<div class="message-name">${escapeHtml(data.displayName || 'Ученик')}</div>`;
        if (data.sticker) {
            bubble.innerHTML += `<img src="${data.sticker}" class="message-sticker">`;
        } else {
            bubble.innerHTML += `<div class="message-text">${escapeHtml(data.text || '')}</div>`;
        }
        bubble.innerHTML += `<div class="message-time">${data.createdAt ? new Date(data.createdAt.toDate()).toLocaleTimeString() : ''}</div>`;
        div.appendChild(avatar);
        div.appendChild(bubble);
        return div;
    }

    function escapeHtml(str) { 
        if (!str) return '';
        return str.replace(/[&<>]/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); 
    }

    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'flex';
            if (unsubscribeMessages) unsubscribeMessages();
            unsubscribeMessages = db.collection('rooms').doc(CHAT_ROOM_ID).collection('messages').orderBy('createdAt').onSnapshot((snap) => {
                const container = document.getElementById('messagesList');
                container.innerHTML = '';
                snap.forEach(doc => container.appendChild(renderMessage(doc)));
                container.scrollTop = container.scrollHeight;
            });
            document.getElementById('membersList').innerHTML = `<div class="member-item"><div class="member-avatar">${(user.displayName||'?')[0]}</div><div class="member-info"><div class="member-name">${user.displayName || user.email}</div><div class="member-status"><span style="color:#22c55e">🟢 Онлайн</span></div></div></div>`;
        } else {
            document.getElementById('authContainer').style.display = 'block';
            document.getElementById('chatContainer').style.display = 'none';
        }
    });

    document.getElementById('googleLoginBtn').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    document.getElementById('emailLoginBtn').onclick = () => auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
    document.getElementById('sendBtn').onclick = async () => {
        const input = document.getElementById('messageInput');
        if (!input.value.trim()) return;
        await db.collection('rooms').doc(CHAT_ROOM_ID).collection('messages').add({
            uid: currentUser.uid,
            displayName: currentUser.displayName,
            text: input.value,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = '';
    };
    document.getElementById('stickerBtn').onclick = () => {
        const panel = document.getElementById('stickersPanel');
        panel.classList.toggle('hidden');
        loadStickers();
    };
    document.getElementById('attachBtn').onclick = () => alert('📎 Прикрепление файлов скоро появится');
    document.getElementById('showRegisterBtn').onclick = () => alert('Регистрация: напиши старосте, он добавит тебя.');
</script>
</body>
</html>
