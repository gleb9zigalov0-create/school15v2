<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Чат 5А | Школа №15</title>
    <link rel="stylesheet" href="common.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: url('images/fon.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        .chat-container {
            width: 1400px;
            max-width: 98vw;
            height: 90vh;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Левая панель */
        .members-panel {
            width: 280px;
            background: rgba(10, 30, 50, 0.3);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .members-header {
            padding: 1.5rem 1rem;
            font-weight: bold;
            color: white;
            background: rgba(0, 0, 0, 0.2);
        }

        .members-list {
            flex: 1;
            list-style: none;
            padding: 0.5rem;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem;
            border-radius: 32px;
            background: rgba(255,255,255,0.1);
            margin-bottom: 0.5rem;
        }

        .member-avatar {
            width: 40px;
            height: 40px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .member-name {
            font-weight: 600;
            color: white;
        }

        /* Основная зона */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
        }

        .chat-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-weight: bold;
            color: white;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }

        /* Сообщения */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .message {
            display: flex;
            gap: 0.8rem;
            align-items: flex-start;
            max-width: 80%;
        }

        .message.mine {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.7rem;
        }

        .message-bubble {
            background: rgba(255, 255, 255, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            color: #1e2f3e;
        }

        .message.mine .message-bubble {
            background: #0a3f6f;
            color: white;
        }

        .message-name {
            font-size: 0.7rem;
            font-weight: bold;
        }

        /* Нижняя панель */
        .input-area {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 40px;
            font-size: 1.3rem;
            cursor: pointer;
        }

        .message-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 40px;
            padding: 0.7rem 1rem;
        }

        /* Модалки */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: rgba(30, 50, 70, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 1.5rem;
            min-width: 260px;
            text-align: center;
            color: white;
        }

        .sticker-pack {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin: 1rem 0;
        }

        .sticker {
            width: 80px;
            cursor: pointer;
            background: white;
            border-radius: 20px;
            padding: 0.3rem;
        }
    </style>
</head>
<body>
<div id="authScreen" style="text-align:center; background:white; padding:2rem; border-radius:48px">
    <h2>Вход в чат</h2>
    <button id="googleBtn">Войти через Google</button>
</div>

<div class="chat-container" id="chatContainer" style="display:none">
    <div class="members-panel">
        <div class="members-header">👥 Онлайн</div>
        <ul class="members-list" id="membersList"></ul>
    </div>
    <div class="chat-main">
        <div class="chat-header">
            <span class="chat-title">💬 5А класс</span>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="input-area">
            <button class="icon-btn" id="stickerBtn">😊</button>
            <input type="text" class="message-input" id="messageInput" placeholder="Сообщение...">
            <button class="icon-btn" id="attachBtn">📎</button>
            <button class="icon-btn" id="sendBtn">➤</button>
        </div>
    </div>
</div>

<div id="stickerModal" class="modal"><div class="modal-content"><h3>Стикеры</h3><div id="stickerPack"></div><button onclick="closeModal('stickerModal')">Закрыть</button></div></div>
<div id="attachModal" class="modal"><div class="modal-content"><h3>Выбери файл</h3><input type="file" id="fileInput" accept="image/*,video/*,.pdf"><button onclick="uploadFile()">Отправить</button><br><button onclick="closeModal('attachModal')">Отмена</button></div></div>

<script src="js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
    // Инициализация Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUser = null;

    // Стикеры (все файлы из папки stickers/)
    const stickers = ['stickers/okay.gif'];

    function renderStickers() {
        const container = document.getElementById('stickerPack');
        container.innerHTML = stickers.map(s => `<img src="${s}" class="sticker" onclick="sendSticker('${s}')">`).join('');
    }

    window.sendSticker = (url) => {
        if (!currentUser) return;
        db.collection('rooms').doc('class5a').collection('messages').add({
            text: '',
            stickerUrl: url,
            uid: currentUser.uid,
            name: currentUser.displayName || currentUser.email?.split('@')[0] || 'Ученик',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        closeModal('stickerModal');
    };

    function sendMessage(text) {
        if (!text.trim() || !currentUser) return;
        db.collection('rooms').doc('class5a').collection('messages').add({
            text: text,
            uid: currentUser.uid,
            name: currentUser.displayName || currentUser.email?.split('@')[0] || 'Ученик',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    }

    function loadMessages() {
        db.collection('rooms').doc('class5a').collection('messages').orderBy('createdAt').onSnapshot(snap => {
            const container = document.getElementById('messagesArea');
            container.innerHTML = '';
            snap.forEach(doc => {
                const m = doc.data();
                const mine = m.uid === currentUser?.uid;
                const div = document.createElement('div');
                div.className = `message ${mine ? 'mine' : ''}`;
                div.innerHTML = `
                    <div class="message-avatar">${(m.name?.charAt(0) || '?')}</div>
                    <div class="message-bubble">
                        <div class="message-name">${m.name}</div>
                        <div>${m.stickerUrl ? `<img src="${m.stickerUrl}" style="max-width:120px">` : (m.text || '')}</div>
                    </div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        });
    }

    function loadOnlineUsers() {
        // упрощённо: просто список залогиненных через статус в Firestore
        db.collection('status').onSnapshot(snap => {
            const container = document.getElementById('membersList');
            container.innerHTML = '';
            snap.forEach(doc => {
                const u = doc.data();
                if (u.online) {
                    const li = document.createElement('li');
                    li.className = 'member-item';
                    li.innerHTML = `<div class="member-avatar">${(u.name?.charAt(0) || '?')}</div><div class="member-name">${u.name}</div>`;
                    container.appendChild(li);
                }
            });
        });
    }

    window.uploadFile = () => {
        alert('Пока отправка файлов через Storage, сделаем позже');
        closeModal('attachModal');
    };
    window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    // Авторизация
    document.getElementById('googleBtn').onclick = () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
    };
    auth.onAuthStateChanged(async user => {
        if (user) {
            currentUser = user;
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'flex';
            await db.collection('status').doc(user.uid).set({ online: true, name: user.displayName || user.email }, { merge: true });
            loadMessages();
            loadOnlineUsers();
        } else {
            document.getElementById('authScreen').style.display = 'block';
            document.getElementById('chatContainer').style.display = 'none';
        }
    });
    document.getElementById('logoutBtn').onclick = () => auth.signOut();
    document.getElementById('sendBtn').onclick = () => {
        const inp = document.getElementById('messageInput');
        sendMessage(inp.value);
        inp.value = '';
    };
    document.getElementById('stickerBtn').onclick = () => { renderStickers(); document.getElementById('stickerModal').style.display = 'flex'; };
    document.getElementById('attachBtn').onclick = () => document.getElementById('attachModal').style.display = 'flex';
</script>
</body>
</html>
