                        embedUrl = `https://www.youtube.com/embed/${videoId}`;
                    } else if (videoUrlMatch[0].includes('rutube')) {
                        embedUrl = videoUrlMatch[0];
                    }
                    mediaHtml = `<div style="margin-top:8px;"><iframe src="${embedUrl}" style="width:280px; max-width:100%; height:180px; border-radius:16px; border:none;" allowfullscreen></iframe></div>`;
                }
                if (m.sticker) mediaHtml += `<img src="${m.sticker}" style="max-width:130px; cursor:pointer;" class="clickable-media" data-type="image" data-url="${m.sticker}">`;
                if (m.type === 'poll') {
                    const votes = m.votes || {};
                    const totalVotes = Object.keys(votes).length;
                    const userVote = votes[currentUser.uid];
                    const hasCorrect = m.correctOption !== null && m.correctOption !== undefined;
                    let optionsHtml = '';
                    for (let i = 0; i < m.options.length; i++) {
                        const opt = m.options[i];
                        const count = Object.values(votes).filter(v => v === i).length;
                        const percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                        let optClass = 'poll-option';
                        if (userVote === i && hasCorrect && i !== m.correctOption) optClass += ' wrong-selected';
                        else if (userVote === i) optClass += ' selected';
                        optionsHtml += `<div class="${optClass}" data-poll-id="${m.id}" data-poll-opt="${i}"><div style="display:flex; align-items:center; gap:0.5rem; flex:1;"><span class="poll-icon">${userVote === i ? (hasCorrect && i === m.correctOption ? '✅' : '🔘') : '◯'}</span><span>${escapeHtml(opt)}</span></div><div style="display:flex; align-items:center; gap:0.5rem;"><span class="poll-option-count">${count} (${percent}%)</span><button class="poll-voters-btn" data-poll-id="${m.id}" data-poll-opt="${i}">👥</button></div></div>`;
                    }
                    mediaHtml = `<div class="poll-container"><div class="poll-title">📊 ${escapeHtml(m.title)}</div>${optionsHtml}<div class="poll-total">Всего голосов: ${totalVotes}</div></div>`;
                }
                
                // АУДИО С ЖИВОЙ ВИЗУАЛИЗАЦИЕЙ
                if (m.audio) {
                    mediaHtml += `
                        <div class="audio-player" data-audio-url="${m.audio}" data-audio-duration="${m.audioDuration || '0:00'}">
                            <button class="audio-play-btn">▶️</button>
                            <div class="audio-wave-container">
                                <div class="audio-wave-bars"></div>
                            </div>
                            <div class="audio-time-display">0:00 / ${m.audioDuration || '0:00'}</div>
                        </div>
                    `;
                }
                
                const seenCount = (m.seenBy || []).filter(uid => uid !== m.uid).length;
                const statusHtml = seenCount > 0 ? '<span class="delivered">✅✅</span>' : '<span class="sent">⌛</span>';
                const div = document.createElement('div');
                div.className = `message ${mine ? 'mine' : ''}`;
                div.id = m.id;
                div.innerHTML = `<div class="msg-avatar">${avatarHtml}</div><div class="msg-bubble">${replyHtml}<div class="msg-name">${userData.name || m.name || 'Ученик'}</div><div class="msg-text">${mediaHtml} ${m.text && !videoUrlMatch ? m.text : ''}</div><div class="msg-footer"><div class="status-icons">${statusHtml}</div><div class="msg-actions"><button class="delete-btn" data-msg-id="${m.id}" data-msg-text="${escapeHtml(m.text || 'Фото/видео/голосовое/стикер/опрос')}">🗑️</button><button class="seen-btn" data-msg-id="${m.id}">👁️</button></div></div><div class="msg-time">${m.createdAt?.toDate().toLocaleTimeString() || ''}</div></div>`;
                container.appendChild(div);
                
                // === ЖИВОЙ АУДИОПЛЕЕР С ВИЗУАЛИЗАЦИЕЙ ===
                const audioPlayerDiv = div.querySelector('.audio-player');
                if (audioPlayerDiv) {
                    const audioUrl = audioPlayerDiv.getAttribute('data-audio-url');
                    const fullDuration = audioPlayerDiv.getAttribute('data-audio-duration');
                    const audio = new Audio(audioUrl);
                    const playBtn = audioPlayerDiv.querySelector('.audio-play-btn');
                    const waveContainer = audioPlayerDiv.querySelector('.audio-wave-container');
                    const barsContainer = audioPlayerDiv.querySelector('.audio-wave-bars');
                    const timeDisplay = audioPlayerDiv.querySelector('.audio-time-display');
                    
                    const barCount = 40;
                    let bars = [];
                    let animationId = null;
                    let audioCtx = null;
                    let sourceNode = null;
                    let analyserNode = null;
                    let isPlaying = false;
                    let isDragging = false;
                    
                    for (let i = 0; i < barCount; i++) {
                        const bar = document.createElement('div');
                        bar.className = 'audio-wave-bar';
                        bar.style.height = '8px';
                        bar.style.background = '#ffffff';
                        barsContainer.appendChild(bar);
                        bars.push(bar);
                    }
                    
                    function stopVisualization() {
                        if (animationId) cancelAnimationFrame(animationId);
                        if (sourceNode) try { sourceNode.disconnect(); } catch(e) {}
                        if (analyserNode) try { analyserNode.disconnect(); } catch(e) {}
                        if (audioCtx) try { audioCtx.close(); } catch(e) {}
                        audioCtx = null;
                        sourceNode = null;
                        analyserNode = null;
                        for (let bar of bars) {
                            bar.style.height = '8px';
                            bar.style.background = '#ffffff';
                        }
                    }
                    
                    async function setupAudioContext() {
                        if (audioCtx) return;
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        analyserNode = audioCtx.createAnalyser();
                        analyserNode.fftSize = 256;
                        sourceNode = audioCtx.createMediaElementSource(audio);
                        sourceNode.connect(analyserNode);
                        analyserNode.connect(audioCtx.destination);
                        if (audioCtx.state === 'suspended') await audioCtx.resume();
                    }
                    
                    function updateVisualization() {
                        if (!isPlaying || !analyserNode) return;
                        const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
                        analyserNode.getByteFrequencyData(dataArray);
                        const step = Math.floor(dataArray.length / barCount);
                        for (let i = 0; i < barCount; i++) {
                            const value = dataArray[i * step] || 0;
                            const percent = Math.min(100, Math.max(5, (value / 255) * 60 + 10));
                            bars[i].style.height = `${percent}%`;
                            bars[i].style.background = '#4ade80';
                        }
                        animationId = requestAnimationFrame(updateVisualization);
                    }
                    
                    audio.addEventListener('play', async () => {
                        isPlaying = true;
                        await setupAudioContext();
                        updateVisualization();
                    });
                    audio.addEventListener('pause', () => {
                        isPlaying = false;
                        stopVisualization();
                    });
                    audio.addEventListener('ended', () => {
                        isPlaying = false;
                        stopVisualization();
                        playBtn.textContent = '▶️';
                        timeDisplay.textContent = `0:00 / ${fullDuration}`;
                        for (let bar of bars) bar.style.height = '8px';
                    });
                    audio.addEventListener('timeupdate', () => {
                        if (!isDragging && audio.duration) {
                            const percent = audio.currentTime / audio.duration;
                            const activeCount = Math.floor(percent * barCount);
                            for (let i = 0; i < barCount; i++) {
                                if (i < activeCount) {
                                    bars[i].style.background = '#4ade80';
                                } else {
                                    bars[i].style.background = '#ffffff';
                                }
                            }
                            const minutes = Math.floor(audio.currentTime / 60);
                            const seconds = Math.floor(audio.currentTime % 60);
                            timeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')} / ${fullDuration}`;
                        }
                    });
                    
                    playBtn.onclick = (e) => {
                        e.stopPropagation();
                        if (isPlaying) {
                            audio.pause();
                            playBtn.textContent = '▶️';
                        } else {
                            audio.play();
                            playBtn.textContent = '⏸';
                        }
                    };
                    
                    function handleSeek(e) {
                        if (!audio.duration) return;
                        const rect = waveContainer.getBoundingClientRect();
                        let clientX = e.clientX;
                        if (e.touches) clientX = e.touches[0].clientX;
                        let percent = (clientX - rect.left) / rect.width;
                        percent = Math.min(1, Math.max(0, percent));
                        audio.currentTime = audio.duration * percent;
                        const activeCount = Math.floor(percent * barCount);
                        for (let i = 0; i < barCount; i++) {
                            if (i < activeCount) bars[i].style.background = '#4ade80';
                            else bars[i].style.background = '#ffffff';
                        }
                        const minutes = Math.floor(audio.currentTime / 60);
                        const seconds = Math.floor(audio.currentTime % 60);
                        timeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')} / ${fullDuration}`;
                    }
                    
                    waveContainer.addEventListener('mousedown', (e) => {
                        isDragging = true;
                        handleSeek(e);
                        const onMouseMove = (moveEvent) => { if (isDragging) handleSeek(moveEvent); };
                        const onMouseUp = () => {
                            isDragging = false;
                            window.removeEventListener('mousemove', onMouseMove);
                            window.removeEventListener('mouseup', onMouseUp);
                        };
                        window.addEventListener('mousemove', onMouseMove);
                        window.addEventListener('mouseup', onMouseUp);
                    });
                    waveContainer.addEventListener('touchstart', (e) => {
                        isDragging = true;
                        handleSeek(e);
                        const onTouchMove = (moveEvent) => { if (isDragging) handleSeek(moveEvent); };
                        const onTouchEnd = () => {
                            isDragging = false;
                            window.removeEventListener('touchmove', onTouchMove);
                            window.removeEventListener('touchend', onTouchEnd);
                        };
                        window.addEventListener('touchmove', onTouchMove);
                        window.addEventListener('touchend', onTouchEnd);
                    });
                }
                
                div.querySelectorAll('.clickable-media').forEach(el => {
                    el.addEventListener('click', (e) => { e.stopPropagation(); const type = el.getAttribute('data-type'); const url = el.getAttribute('data-url'); showMediaViewer(url, type, e); });
                });
                div.querySelectorAll(`.poll-option[data-poll-id="${m.id}"]`).forEach(opt => {
                    opt.addEventListener('click', (e) => { if (e.target.classList.contains('poll-voters-btn')) return; votePoll(m.id, parseInt(opt.dataset.pollOpt)); });
                });
                div.querySelectorAll(`.poll-voters-btn[data-poll-id="${m.id}"]`).forEach(btn => {
                    btn.addEventListener('click', (e) => { e.stopPropagation(); showPollVoters(m, parseInt(btn.dataset.pollOpt)); });
                });
                const replyBlock = div.querySelector('.reply-preview');
                if (replyBlock && replyToId) replyBlock.addEventListener('click', (e) => { e.stopPropagation(); scrollToMessage(replyToId); });
                div.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); showContextMenu(e.clientX, e.clientY, { id: m.id, text: m.text || '', name: userData.name || m.name, uid: m.uid, images: m.images, videos: m.videos, audio: m.audio, sticker: m.sticker, type: m.type, title: m.title }); });
                let pressTimer;
                div.addEventListener('touchstart', (e) => { pressTimer = setTimeout(() => { const touch = e.touches[0]; showContextMenu(touch.clientX, touch.clientY, { id: m.id, text: m.text || '', name: userData.name || m.name, uid: m.uid, images: m.images, videos: m.videos, audio: m.audio, sticker: m.sticker, type: m.type, title: m.title }); }, 500); });
                div.addEventListener('touchend', () => clearTimeout(pressTimer));
                div.addEventListener('touchmove', () => clearTimeout(pressTimer));
                
                const deleteBtn = div.querySelector('.delete-btn');
                if (deleteBtn) {
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        let previewHtml = '';
                        if (m.text && m.text.trim()) previewHtml += `<div>📝 ${escapeHtml(m.text.substring(0, 150))}${m.text.length > 150 ? '…' : ''}</div>`;
                        if (m.images && m.images.length) previewHtml += `<div style="margin-top:8px;"><img src="${m.images[0]}" style="max-width:100px; border-radius:12px;"><br>📷 ${m.images.length} фото</div>`;
                        if (m.videos && m.videos.length) previewHtml += `<div style="margin-top:8px;">🎥 Видео (${m.videos.length})</div>`;
                        if (m.audio) previewHtml += `<div style="margin-top:8px;">🎤 Голосовое сообщение</div>`;
                        if (m.sticker) previewHtml += `<div style="margin-top:8px;"><img src="${m.sticker}" style="max-width:80px; border-radius:12px;"><br>😊 Стикер</div>`;
                        if (m.type === 'poll') previewHtml += `<div style="margin-top:8px;">📊 Опрос: ${escapeHtml(m.title)}<br>📌 ${m.options.length} вариантов</div>`;
                        if (!previewHtml) previewHtml = '<div>Сообщение</div>';
                        showDeleteModal(m.id, previewHtml);
                    });
                }
                
                div.querySelector('.seen-btn')?.addEventListener('click', async (e) => {
                    const users = [];
                    for (const uid of (m.seenBy || [])) if (uid !== currentUser?.uid) { const userData = await getUserData(uid); users.push(userData.name || 'Ученик'); }
                    document.getElementById('seenModalContent').innerHTML = `<div class="modal-title">👁️ Просмотрено</div><div class="seen-modal-list">${users.map(u => `<div class="seen-item"><div class="seen-avatar">${u.charAt(0)}</div><span>${u}</span></div>`).join('')}</div><button class="close-btn" id="seenCloseBtn">Закрыть</button>`;
                    document.getElementById('seenCloseBtn').onclick = () => closeModal('seenSheet');
                    openModal('seenSheet');
                });
            }
            
            for (let [tempId, pending] of pendingMessages.entries()) {
                if (!document.getElementById(tempId)) {
                    const userData = await getUserData(currentUser.uid);
                    const avatarHtml = getAvatarHtml(userData.avatarBase64, userData.name);
                    let mediaHtml = '';
                    if (pending.images?.length) {
                        mediaHtml = `<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:4px; max-width:260px;">`;
                        for (let img of pending.images) mediaHtml += `<div class="loading-spinner-overlay" style="position:relative; display:block; width:100%; aspect-ratio:1; border-radius:12px; overflow:hidden;"><img src="${img}" style="width:100%; aspect-ratio:1; object-fit:cover; filter: brightness(0.5) blur(4px);"><div class="spinner"></div></div>`;
                        mediaHtml += `</div>`;
                    }
                    if (pending.videos?.length) {
                        for (let i = 0; i < pending.videos.length; i++) mediaHtml += `<div class="loading-spinner-overlay" style="position:relative; display:block; width:280px; max-width:100%; aspect-ratio:16/9; border-radius:16px; overflow:hidden; background:#000; margin-top:8px;"><div class="spinner"></div></div>`;
                    }
                    if (pending.audio) {
                        mediaHtml += `
                            <div class="audio-player" data-audio-url="${pending.audio}" data-audio-duration="${pending.audioDuration || '0:00'}">
                                <button class="audio-play-btn">▶️</button>
                                <div class="audio-wave-container">
                                    <div class="audio-wave-bars"></div>
                                </div>
                                <div class="audio-time-display">0:00 / ${pending.audioDuration || '0:00'}</div>
                            </div>
                        `;
                    }
                    const div = document.createElement('div');
                    div.className = 'message mine';
                    div.id = tempId;
                    div.innerHTML = `<div class="msg-avatar">${avatarHtml}</div><div class="msg-bubble"><div class="msg-name">${userData.name || currentUser.displayName || 'Ученик'}</div><div class="msg-text">${mediaHtml} ${pending.text || ''}</div><div class="msg-footer"><div class="status-icons"><span class="sent">⌛</span>${pending.progress ? `<span class="progress-bar">${pending.progress}%</span>` : ''}</div></div><div class="msg-time">отправляется...</div></div>`;
                    container.appendChild(div);
                }
            }
            
            let newHeight = container.scrollHeight;
            if (wasNearBottom) {
                container.scrollTop = container.scrollHeight;
            } else if (!wasNearBottom && messages.length > 0 && oldHeight !== newHeight) {
                newMessagesCount++;
                isScrolledUp = true;
                document.getElementById('scrollDownBtn').style.display = 'flex';
                document.getElementById('scrollDownBtn').innerHTML = `↓ ${newMessagesCount}`;
            }
            updateScrollDownButton();
            
            for (const change of snap.docChanges()) {
                const m = change.doc.data();
                if (change.type === 'added' && m.uid !== currentUser.uid) {
                    if (!m.seenBy || !m.seenBy.includes(currentUser.uid)) await markAsSeen(change.doc.id);
                }
            }
        });
    }
    
    async function loadMembers() {
        db.collection('status').onSnapshot(async (snap) => {
            const container = document.getElementById('membersList');
            container.innerHTML = '';
            for (const doc of snap.docs) {
                const status = doc.data();
                const userData = await getUserData(doc.id);
                const avatarHtml = getAvatarHtml(userData.avatarBase64, userData.name);
                const isOnline = status.online && (new Date() - (status.lastSeen?.toDate?.() || 0) < 60000);
                const statusText = isOnline ? '🟢 Онлайн' : (status.lastSeen ? `⚫ Был(а) ${status.lastSeen.toDate().toLocaleTimeString()}` : '⚫ Офлайн');
                container.innerHTML += `<li class="member-item"><div class="member-avatar">${avatarHtml}</div><div class="member-info"><div class="member-name">${userData.name || status.name || 'Ученик'}</div><div class="member-status ${isOnline ? 'online-status' : 'offline-status'}">${statusText}</div></div></li>`;
            }
        });
    }
    
    async function sendMessageOptimistic(text, imagesArray, videosArray, audioDataUrl = null, audioDuration = null, stickerUrl = null, pollObject = null) {
        const tempId = 'temp_' + Date.now() + '_' + Math.random();
        const userData = await getUserData(currentUser.uid);
        const replyData = replyToMsg ? {
            id: replyToMsg.id,
            text: replyToMsg.text || (replyToMsg.images ? '📷 Фото' : (replyToMsg.videos ? '🎥 Видео' : (replyToMsg.audio ? '🎤 Голосовое' : (replyToMsg.sticker ? '😊 Стикер' : (replyToMsg.type === 'poll' ? '📊 Опрос' : ''))))),
            name: replyToMsg.name,
            uid: replyToMsg.uid,
            type: replyToMsg.type === 'poll' ? 'poll' : undefined,
            title: replyToMsg.title
        } : null;
        
        pendingMessages.set(tempId, { text: text || '', images: imagesArray || [], videos: videosArray || [], audio: audioDataUrl, audioDuration: audioDuration, progress: 0 });
        loadMessages();
        
        let progressInterval = null;
        if (audioDataUrl || videosArray?.length || imagesArray?.length) {
            let progress = 0;
            progressInterval = setInterval(() => { if (progress < 95) { progress += 5; const pending = pendingMessages.get(tempId); if (pending) pending.progress = progress; } }, 100);
        }
        
        try {
            const msgData = {
                text: text || '', images: imagesArray || [], videos: videosArray || [], audio: audioDataUrl, audioDuration: audioDuration, sticker: stickerUrl,
                uid: currentUser.uid, name: userData.name || currentUser.displayName || 'Ученик',
                seenBy: [currentUser.uid], createdAt: new Date(),
                replyTo: replyData
            };
            if (pollObject) Object.assign(msgData, pollObject);
            await db.collection('rooms').doc(CHAT_PATH).collection('messages').add(msgData);
            if (progressInterval) clearInterval(progressInterval);
            pendingMessages.delete(tempId);
            cancelReply();
            loadMessages();
        } catch (err) {
            console.error('Ошибка:', err);
            if (progressInterval) clearInterval(progressInterval);
            pendingMessages.delete(tempId);
            loadMessages();
            alert('Ошибка отправки: ' + (err.message || 'неизвестная ошибка'));
        }
    }
    
    function renderAttachMain() {
        const container = document.getElementById('attachModalContent');
        if (!container) return;
        container.innerHTML = `
            <div class="modal-title">📎 Отправить</div>
            <div class="attach-grid">
                <div class="attach-item" data-type="camera"><div class="attach-icon">📷</div><div class="attach-label">Камера</div></div>
                <div class="attach-item" data-type="video"><div class="attach-icon">🎥</div><div class="attach-label">Видео</div></div>
                <div class="attach-item" data-type="file"><div class="attach-icon">📄</div><div class="attach-label">Файл</div></div>
                <div class="attach-item" data-type="poll"><div class="attach-icon">📊</div><div class="attach-label">Опрос</div></div>
                <div class="attach-item" data-type="voice"><div class="attach-icon">🎤</div><div class="attach-label">Голос</div></div>
                <div class="attach-item" data-type="link"><div class="attach-icon">🔗</div><div class="attach-label">Ссылка</div></div>
            </div>
            <button class="close-btn" id="attachModalCloseBtn">Закрыть</button>
        `;
        document.querySelectorAll('.attach-item').forEach(el => {
            el.onclick = (e) => {
                e.stopPropagation();
                if (el.dataset.type === 'camera') { attachScreen = 'camera'; renderCameraScreen(); }
                else if (el.dataset.type === 'video') { attachScreen = 'video'; renderVideoScreen(); }
                else if (el.dataset.type === 'poll') { createPoll(); }
                else if (el.dataset.type === 'voice') {
                    startRecordingFromSheet();
                    const overlay = document.getElementById('audioRecorderOverlay');
                    const recorderBtn = document.getElementById('recorderBtn');
                    const stopHandler = () => { 
                        stopRecordingFromSheet(); 
                        recorderBtn.removeEventListener('mouseup', stopHandler); 
                        recorderBtn.removeEventListener('touchend', stopHandler); 
                        overlay.removeEventListener('mouseleave', stopHandler);
                        attachScreen = 'main';
                        renderAttachMain();
                    };
                    recorderBtn.addEventListener('mouseup', stopHandler);
                    recorderBtn.addEventListener('touchend', stopHandler);
                    overlay.addEventListener('mouseleave', stopHandler);
                } else {
                    alert(`📎 Отправка ${el.dataset.type} — в разработке`);
                }
            };
        });
        document.getElementById('attachModalCloseBtn').onclick = (e) => { closeModal('attachSheet'); };
    }
    
    function renderCameraScreen() {
        const container = document.getElementById('attachModalContent');
        if (!container) return;
        container.innerHTML = `<div class="attach-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;"><button class="back-btn" id="cameraBackBtn">← Назад</button><span class="modal-title">Снять фото</span><div style="width:50px;"></div></div><div id="photoGallery" class="photo-gallery"></div><div class="camera-actions"><button class="full-width-btn" id="openCameraBtn">📷 Сфотографировать</button><button class="full-width-btn" id="selectFromGalleryBtn">📁 Выбрать из галереи</button></div><button class="close-btn" id="attachModalCloseBtn" style="margin-top:10px;">Закрыть</button>`;
        renderMediaGallery();
        document.getElementById('cameraBackBtn').onclick = () => { attachScreen = 'main'; renderAttachMain(); };
        document.getElementById('openCameraBtn').onclick = () => showCameraModal('image');
        document.getElementById('selectFromGalleryBtn').onclick = () => { const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.multiple = true; input.onchange = (e) => { if (e.target.files) addFiles(e.target.files, 'image'); input.remove(); }; input.click(); };
        document.getElementById('attachModalCloseBtn').onclick = (e) => { closeModal('attachSheet'); };
    }
    
    function renderVideoScreen() {
        const container = document.getElementById('attachModalContent');
        if (!container) return;
        container.innerHTML = `<div class="attach-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;"><button class="back-btn" id="videoBackBtn">← Назад</button><span class="modal-title">Записать видео</span><div style="width:50px;"></div></div><div id="videoGallery" class="photo-gallery"></div><div class="camera-actions"><button class="full-width-btn" id="recordVideoBtn">🎥 Записать видео</button><button class="full-width-btn" id="selectVideoFromGalleryBtn">📁 Выбрать из галереи</button></div><button class="close-btn" id="attachModalCloseBtn" style="margin-top:10px;">Закрыть</button>`;
        renderMediaGallery();
        document.getElementById('videoBackBtn').onclick = () => { attachScreen = 'main'; renderAttachMain(); };
        document.getElementById('recordVideoBtn').onclick = () => showCameraModal('video');
        document.getElementById('selectVideoFromGalleryBtn').onclick = () => { const input = document.createElement('input'); input.type = 'file'; input.accept = 'video/*'; input.multiple = true; input.onchange = (e) => { if (e.target.files) addFiles(e.target.files, 'video'); input.remove(); }; input.click(); };
        document.getElementById('attachModalCloseBtn').onclick = (e) => { closeModal('attachSheet'); };
    }
    
    function renderMediaGallery() {
        const gallery = document.getElementById('photoGallery') || document.getElementById('videoGallery');
        if (!gallery) return;
        if (!selectedMedia.length) { gallery.innerHTML = '<div class="empty-photo">😕 Нет выбранных медиа</div>'; return; }
        gallery.innerHTML = '';
        for (let i = 0; i < selectedMedia.length; i++) {
            const media = selectedMedia[i];
            const div = document.createElement('div'); div.className = 'photo-item';
            if (media.type === 'image') { const img = document.createElement('img'); img.src = media.data; div.appendChild(img); }
            else { const video = document.createElement('video'); video.src = media.data; video.preload = 'metadata'; video.style.cssText = 'width:100%; aspect-ratio:1; object-fit:cover; border-radius:16px;'; div.appendChild(video); const badge = document.createElement('div'); badge.className = 'video-badge'; badge.textContent = '🎥'; div.appendChild(badge); }
            const numberSpan = document.createElement('div'); numberSpan.className = 'photo-number'; numberSpan.textContent = i + 1;
            div.appendChild(numberSpan);
            div.onclick = () => { selectedMedia.splice(i, 1); renderMediaGallery(); };
            gallery.appendChild(div);
        }
    }
    
    function addFiles(files, type) {
        const newFiles = Array.from(files);
        const remaining = 8 - selectedMedia.length;
        const toAdd = newFiles.slice(0, remaining);
        for (const file of toAdd) {
            const reader = new FileReader();
            reader.onload = (e) => { selectedMedia.push({ type: type, data: e.target.result }); renderMediaGallery(); };
            reader.readAsDataURL(file);
        }
        if (newFiles.length > remaining) alert(`Можно выбрать до 8 медиафайлов. Добавлено ${remaining}.`);
    }
    
    function showCameraModal(mediaType) {
        const isVideo = mediaType === 'video';
        const origContent = document.getElementById('attachModalContent').innerHTML;
        document.getElementById('attachModalContent').innerHTML = `<div class="preview-header" style="display:flex; justify-content:space-between; margin-bottom:1rem;"><button class="back-btn" id="cameraBackBtn" style="background:#0a3f6f;">← Назад</button><span class="modal-title">${isVideo ? 'Запись видео' : 'Снять фото'}</span><button class="rotate-btn" id="rotateCameraBtn" style="background:#0a3f6f; border:none; border-radius:40px; padding:0.3rem 0.8rem; color:white; cursor:pointer;">🔄</button></div><video id="cameraVideo" autoplay playsinline style="width:100%; border-radius:24px; background:#000;"></video><div class="camera-actions" style="margin-top:1rem;"><button class="full-width-btn" id="captureBtn">${isVideo ? '⏺ Начать запись' : '📸 Сделать снимок'}</button>${isVideo ? '<button class="full-width-btn" id="stopRecordBtn" style="display:none;">⏹ Остановить запись</button>' : ''}</div><button class="close-btn" id="cameraCloseBtn">Закрыть</button>`;
        let facingMode = 'environment', stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        const startCamera = async () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: facingMode } }, audio: isVideo }); }
            catch { try { stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: isVideo }); } catch(e) { alert('Нет доступа к камере'); return; } }
            document.getElementById('cameraVideo').srcObject = stream;
        };
        startCamera();
        document.getElementById('cameraBackBtn').onclick = () => { if (stream) stream.getTracks().forEach(t => t.stop()); document.getElementById('attachModalContent').innerHTML = origContent; renderMediaGallery(); if (isVideo) renderVideoScreen(); else renderCameraScreen(); };
        document.getElementById('rotateCameraBtn').onclick = () => { facingMode = facingMode === 'environment' ? 'user' : 'environment'; startCamera(); };
        if (!isVideo) {
            document.getElementById('captureBtn').onclick = () => {
                const video = document.getElementById('cameraVideo');
                if (!video) return;
                const canvas = document.createElement('canvas'); canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const dataUrl = canvas.toDataURL('image/jpeg');
                if (selectedMedia.length < 8) { selectedMedia.push({ type: 'image', data: dataUrl }); renderMediaGallery(); } else alert('Максимум 8 медиафайлов');
            };
        } else {
            const captureBtn = document.getElementById('captureBtn');
            const stopBtn = document.getElementById('stopRecordBtn');
            captureBtn.onclick = () => {
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                    const reader = new FileReader();
                    reader.onload = (e) => { if (selectedMedia.length < 8) { selectedMedia.push({ type: 'video', data: e.target.result }); renderMediaGallery(); } else alert('Максимум 8 медиафайлов'); };
                    reader.readAsDataURL(blob);
                    captureBtn.style.display = 'block';
                    stopBtn.style.display = 'none';
                };
                mediaRecorder.start();
                captureBtn.style.display = 'none';
                stopBtn.style.display = 'block';
            };
            stopBtn.onclick = () => { if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); };
        }
        document.getElementById('cameraCloseBtn').onclick = () => { if (stream) stream.getTracks().forEach(t => t.stop()); document.getElementById('attachModalContent').innerHTML = origContent; renderMediaGallery(); if (isVideo) renderVideoScreen(); else renderCameraScreen(); };
    }
    
    initSwipeClose('stickerSheet', 'stickerHandle');
    initSwipeClose('attachSheet', 'attachHandle');
    initSwipeClose('seenSheet', 'seenHandle');
    
    document.getElementById('cancelDeleteModalBtn').onclick = closeDeleteModal;
    document.getElementById('confirmDeleteModalBtn').onclick = confirmDelete;
    document.getElementById('mediaViewerClose').onclick = closeMediaViewer;
    document.getElementById('mediaViewer').addEventListener('click', (e) => { if (e.target === document.getElementById('mediaViewer')) closeMediaViewer(); });
    document.getElementById('cancelReplyBtn').onclick = cancelReply;
    document.getElementById('stickerBtn').onclick = () => { renderStickerModal(); openModal('stickerSheet'); };
    document.getElementById('attachBtn').onclick = () => { attachScreen = 'main'; selectedMedia = []; renderAttachMain(); openModal('attachSheet'); };
    document.getElementById('scrollDownBtn').onclick = () => {
        const msgsArea = document.getElementById('messagesArea');
        msgsArea.scrollTo({ top: msgsArea.scrollHeight, behavior: 'smooth' });
        newMessagesCount = 0;
        isScrolledUp = false;
        document.getElementById('scrollDownBtn').style.display = 'none';
    };
    const msgsArea = document.getElementById('messagesArea');
    msgsArea.addEventListener('scroll', () => {
        const isNearBottom = msgsArea.scrollHeight - msgsArea.scrollTop - msgsArea.clientHeight < 100;
        if (isNearBottom) {
            newMessagesCount = 0;
            isScrolledUp = false;
            document.getElementById('scrollDownBtn').style.display = 'none';
        } else {
            document.getElementById('scrollDownBtn').style.display = 'flex';
            if (newMessagesCount > 0) document.getElementById('scrollDownBtn').innerHTML = `↓ ${newMessagesCount}`;
            else document.getElementById('scrollDownBtn').innerHTML = '↓';
        }
    });
    document.getElementById('messageInput').addEventListener('input', () => {
        sendTyping(true);
    });
    document.getElementById('sendBtn').onclick = async () => {
        sendTyping(false);
        const text = document.getElementById('messageInput').value;
        const images = selectedMedia.filter(m => m.type === 'image').map(m => m.data);
        const videos = selectedMedia.filter(m => m.type === 'video').map(m => m.data);
        const audio = getAudioPreviewData();
        const audioDuration = document.getElementById('recorderTimer')?.textContent || null;
        if (audio) { await sendMessageOptimistic(text, images, videos, audio, audioDuration); clearAudioPreview(); selectedMedia = []; document.getElementById('messageInput').value = ''; closeModal('attachSheet'); }
        else if (selectedMedia.length) { await sendMessageOptimistic(text, images, videos); selectedMedia = []; document.getElementById('messageInput').value = ''; closeModal('attachSheet'); }
        else if (text.trim()) { await sendMessageOptimistic(text, null, null); document.getElementById('messageInput').value = ''; }
    };
    document.getElementById('settingsBtn').onclick = () => window.location.href = 'settings.html';
    
    setTimeout(() => {
        const skeletons = document.querySelectorAll('.skeleton');
        skeletons.forEach(s => s.remove());
    }, 1000);
</script>
</body>
