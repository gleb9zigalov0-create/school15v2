<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Чат 5А | Школа №15</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* Глобальные стили чата */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            background: url('images/fon.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        /* Матовое стекло для всего чата */
        .chat-container {
            width: 1400px;
            max-width: 98vw;
            height: 90vh;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* ===== ЛЕВАЯ ПАНЕЛЬ (УЧАСТНИКИ) ===== */
        .members-panel {
            width: 300px;
            background: rgba(10, 30, 50, 0.3);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .members-header {
            padding: 1.5rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: bold;
            color: white;
            background: rgba(0, 0, 0, 0.2);
        }

        .members-list {
            flex: 1;
            list-style: none;
            padding: 0.5rem;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem;
            margin-bottom: 0.3rem;
            border-radius: 32px;
            transition: background 0.2s;
            cursor: pointer;
        }

        .member-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .member-avatar {
            width: 44px;
            height: 44px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .member-info {
            flex: 1;
        }

        .member-name {
            font-weight: 600;
            color: white;
        }

        .member-status {
            font-size: 0.7rem;
            opacity: 0.7;
            color: #e0e0e0;
        }

        .status-online { color: #4ade80; }
        .status-offline { color: #9ca3af; }

        /* ===== ОСНОВНАЯ ЗОНА ЧАТА ===== */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
        }

        .chat-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-weight: bold;
            color: white;
            font-size: 1.2rem;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* ЛЕНТА СООБЩЕНИЙ */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .message {
            display: flex;
            gap: 0.8rem;
            align-items: flex-start;
            max-width: 80%;
        }

        .message.mine {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .message-bubble {
            background: rgba(255, 255, 255, 0.9);
            padding: 0.6rem 1rem;
            border-radius: 24px;
            border-top-left-radius: 6px;
            color: #1e2f3e;
            word-wrap: break-word;
        }

        .message.mine .message-bubble {
            background: #0a3f6f;
            color: white;
            border-top-right-radius: 6px;
        }

        .message-name {
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 0.2rem;
            opacity: 0.8;
        }

        .message-text {
            font-size: 0.95rem;
        }

        .message-time {
            font-size: 0.6rem;
            opacity: 0.6;
            margin-top: 0.2rem;
            text-align: right;
        }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .input-area {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            display: flex;
            gap: 0.5rem;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 40px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }

        .message-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 40px;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            outline: none;
        }

        /* МОДАЛКИ */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: rgba(30, 50, 70, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 1.5rem;
            min-width: 260px;
            text-align: center;
            color: white;
        }

        .sticker-pack {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 1rem;
        }

        .sticker {
            width: 90px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .sticker:hover { transform: scale(1.1); }

        .file-option {
            background: rgba(255,255,255,0.2);
            padding: 0.6rem;
            margin: 0.3rem 0;
            border-radius: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-container" id="app">
    <!-- левая панель -->
    <div class="members-panel">
        <div class="members-header">👥 Участники 5А</div>
        <ul class="members-list" id="membersList"></ul>
    </div>

    <!-- основной чат -->
    <div class="chat-main">
        <div class="chat-header">
            <span class="chat-title">💬 Общий чат 5 «А»</span>
            <button class="logout-btn" id="logoutBtn">🚪 Выйти</button>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="input-area">
            <button class="icon-btn" id="stickerBtn">😊</button>
            <input type="text" class="message-input" id="messageInput" placeholder="Сообщение...">
            <button class="icon-btn" id="attachBtn">📎</button>
            <button class="icon-btn" id="sendBtn">➤</button>
        </div>
    </div>
</div>

<!-- Модалка стикеров -->
<div id="stickerModal" class="modal">
    <div class="modal-content">
        <h3>Выбери стикер</h3>
        <div class="sticker-pack" id="stickerPack"></div>
        <button class="icon-btn" style="margin-top:1rem" onclick="closeModal('stickerModal')">✖ Закрыть</button>
    </div>
</div>

<!-- Модалка вложения -->
<div id="attachModal" class="modal">
    <div class="modal-content">
        <h3>📎 Отправить файл</h3>
        <div class="file-option" onclick="sendFile('image')">📷 Фото</div>
        <div class="file-option" onclick="sendFile('video')">🎥 Видео</div>
        <div class="file-option" onclick="sendFile('file')">📄 Файл</div>
        <button class="icon-btn" style="margin-top:1rem" onclick="closeModal('attachModal')">Отмена</button>
    </div>
</div>

<script src="js/firebase-config.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateCallback, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let currentUser = null;
    let usersStatusRef = null;

    // Вход (если уже залогинен через chat.html ранее) — упростим, просто аноним
    signInAnonymously(auth).catch(console.error);

    onAuthStateCallback(auth, async (user) => {
        if (user) {
            currentUser = user;
            // статус онлайн
            const userStatusRef = doc(db, "status", user.uid);
            await setDoc(userStatusRef, { online: true, lastSeen: new Date(), name: "Ученик" }, { merge: true });
            usersStatusRef = onSnapshot(collection(db, "status"), () => { renderMembers(); });
            renderMembers();
        }
    });

    async function renderMembers() {
        const snapshot = await getDocs(collection(db, "status"));
        const members = [];
        snapshot.forEach(doc => {
            members.push({ id: doc.id, ...doc.data() });
        });
        const container = document.getElementById('membersList');
        container.innerHTML = members.map(m => `
            <li class="member-item">
                <div class="member-avatar">${(m.name?.charAt(0) || '?')}</div>
                <div class="member-info">
                    <div class="member-name">${m.name || 'Ученик'}</div>
                    <div class="member-status ${m.online ? 'status-online' : 'status-offline'}">${m.online ? '🟢 Онлайн' : '⚫ Офлайн'}</div>
                </div>
            </li>
        `).join('');
    }

    // Отправка сообщения
    async function sendMessage(text, type = 'text', mediaUrl = null) {
        if (!currentUser) return;
        await addDoc(collection(db, "rooms", "class5a", "messages"), {
            text: text,
            type: type,
            mediaUrl: mediaUrl,
            uid: currentUser.uid,
            name: "Ученик",
            createdAt: new Date()
        });
    }

    // Загрузка сообщений
    const messagesQuery = query(collection(db, "rooms", "class5a", "messages"), orderBy("createdAt"));
    onSnapshot(messagesQuery, (snapshot) => {
        const container = document.getElementById('messagesArea');
        container.innerHTML = '';
        snapshot.forEach(doc => {
            const msg = doc.data();
            const mine = msg.uid === currentUser?.uid;
            const div = document.createElement('div');
            div.className = `message ${mine ? 'mine' : ''}`;
            div.innerHTML = `
                <div class="message-avatar">${msg.name?.charAt(0) || '?'}</div>
                <div class="message-bubble">
                    <div class="message-name">${msg.name || 'Ученик'}</div>
                    <div class="message-text">${msg.type === 'sticker' ? `<img src="${msg.mediaUrl}" style="max-width:150px">` : (msg.text || '')}</div>
                    <div class="message-time">${msg.createdAt?.toDate().toLocaleTimeString() || ''}</div>
                </div>
            `;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    });

    // стикеры
    const stickersList = ['stickers/okay.gif']; // твой стикер
    function showStickers() {
        const pack = document.getElementById('stickerPack');
        pack.innerHTML = stickersList.map(s => `<img src="${s}" class="sticker" onclick="window.sendSticker('${s}')">`).join('');
        document.getElementById('stickerModal').style.display = 'flex';
    }
    window.sendSticker = (url) => {
        sendMessage('', 'sticker', url);
        closeModal('stickerModal');
    };

    window.sendFile = (type) => {
        alert(`Функция отправки ${type} в разработке. Можно через Firebase Storage.`);
        closeModal('attachModal');
    };

    window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    document.getElementById('stickerBtn').onclick = showStickers;
    document.getElementById('attachBtn').onclick = () => document.getElementById('attachModal').style.display = 'flex';
    document.getElementById('sendBtn').onclick = () => {
        const input = document.getElementById('messageInput');
        if (input.value.trim()) sendMessage(input.value);
        input.value = '';
    };
    document.getElementById('logoutBtn').onclick = () => { signOut(auth); location.reload(); };
</script>
</body>
</html>
