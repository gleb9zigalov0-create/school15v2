<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Чат 5А | Школа №15</title>
    <link rel="stylesheet" href="common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: url('images/fon.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }
        .chat-main-container {
            width: 1400px;
            max-width: 98vw;
            height: 90vh;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .members-panel {
            width: 280px;
            background: rgba(10, 30, 50, 0.3);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .members-header { padding: 1.5rem 1rem; font-weight: bold; color: white; background: rgba(0, 0, 0, 0.2); font-size: 1.1rem; }
        .members-list { flex: 1; list-style: none; padding: 0.5rem; }
        .member-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 0.5rem;
        }
        .member-avatar {
            width: 44px;
            height: 44px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        .member-info { flex: 1; }
        .member-name { font-weight: 600; color: white; font-size: 0.9rem; }
        .member-status { font-size: 0.7rem; opacity: 0.8; }
        .online-status { color: #4ade80; }
        .offline-status { color: #9ca3af; }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .chat-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .chat-title { font-weight: bold; color: white; font-size: 1.1rem; }
        .settings-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            scroll-behavior: smooth;
        }
        .date-divider { text-align: center; margin: 1rem 0; }
        .date-badge {
            display: inline-block;
            background: rgba(100, 100, 120, 0.7);
            backdrop-filter: blur(8px);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #e0e0e0;
            font-weight: 500;
        }
        .message {
            display: flex;
            gap: 0.6rem;
            align-items: flex-start;
            max-width: 85%;
            position: relative;
            transition: box-shadow 0.4s ease;
            border-radius: 20px;
            padding: 0.1rem 0;
        }
        .message.highlight {
            animation: megaGlow 0.8s ease-out forwards;
        }
        @keyframes megaGlow {
            0% { filter: drop-shadow(0 0 0px rgba(255, 215, 0, 0)) drop-shadow(0 0 0px rgba(0, 200, 255, 0)); background: transparent; }
            20% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.9)) drop-shadow(0 0 25px rgba(0, 200, 255, 0.8)); background: rgba(255, 215, 0, 0.15); }
            40% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 1)) drop-shadow(0 0 35px rgba(0, 200, 255, 0.9)); background: rgba(255, 215, 0, 0.25); }
            60% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8)) drop-shadow(0 0 25px rgba(0, 200, 255, 0.7)); background: rgba(255, 215, 0, 0.15); }
            100% { filter: drop-shadow(0 0 0px rgba(255, 215, 0, 0)) drop-shadow(0 0 0px rgba(0, 200, 255, 0)); background: transparent; }
        }
        .message.mine {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-avatar {
            width: 32px;
            height: 32px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.7rem;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }
        .msg-bubble {
            background: rgba(255, 255, 255, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            color: #1e2f3e;
            position: relative;
        }
        .message.mine .msg-bubble {
            background: #0a3f6f;
            color: white;
        }
        .reply-preview {
            background: rgba(0, 0, 0, 0.08);
            border-left: 3px solid #e94560;
            padding: 0.3rem 0.6rem;
            margin-bottom: 0.4rem;
            border-radius: 12px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .reply-preview:hover { background: rgba(0, 0, 0, 0.15); }
        .message.mine .reply-preview {
            background: rgba(255, 255, 255, 0.15);
            border-left-color: #ffaa00;
        }
        .reply-author { font-weight: bold; opacity: 0.8; font-size: 0.65rem; }
        .reply-text { opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .msg-name { font-size: 0.65rem; font-weight: bold; margin-bottom: 0.2rem; }
        .msg-text { font-size: 0.9rem; }
        .msg-text img {
            max-width: 200px;
            max-height: 200px;
            width: auto;
            height: auto;
            border-radius: 16px;
            margin-top: 0.3rem;
            cursor: pointer;
        }
        .msg-text video {
            width: 280px;
            max-width: 100%;
            height: auto;
            max-height: 280px;
            border-radius: 16px;
            margin-top: 0.3rem;
            cursor: pointer;
            background-color: #000;
        }
        .audio-player {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 40px;
            padding: 0.3rem 0.8rem;
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .audio-play-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .audio-wave {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 30px;
        }
        .audio-wave-bar {
            width: 3px;
            background: white;
            border-radius: 2px;
            transition: height 0.05s ease;
        }
        .audio-duration {
            font-size: 0.7rem;
            color: #ccc;
            margin-left: 0.5rem;
        }
        .msg-time { font-size: 0.6rem; opacity: 0.6; margin-top: 0.2rem; text-align: right; }
        .msg-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .status-icons { display: flex; gap: 4px; font-size: 12px; }
        .delivered { color: #4ade80; }
        .sent { color: #9ca3af; }
        .progress-bar { font-size: 0.6rem; color: #ffaa00; margin-left: 4px; }
        .msg-actions { display: flex; gap: 6px; align-items: center; }
        .delete-btn { background: none; border: none; cursor: pointer; font-size: 14px; color: #ccc; }
        .delete-btn:hover { color: #e94560; }
        .seen-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: #ccc; }
        .seen-btn:hover { color: #fff; }
        
        .input-panel {
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 30;
        }
        .reply-bar {
            display: none;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 28px;
            padding: 0.4rem 0.8rem;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #ddd;
        }
        .reply-bar.active { display: flex; }
        .reply-bar .reply-content { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .reply-bar .cancel-reply {
            background: #e94560;
            border: none;
            color: white;
            border-radius: 40px;
            padding: 0.2rem 0.6rem;
            cursor: pointer;
        }
        .input-row {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            position: relative;
        }
        .icon-button {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 40px;
            font-size: 1.3rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .text-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 40px;
            padding: 0.7rem 1rem;
            font-size: 0.9rem;
            outline: none;
            color: #000 !important;
        }
        .text-input::placeholder { color: #555; }

        /* ТВОЙ ДИЗАЙН АУДИО ЗАПИСИ (через скрепку) */
        .audio-recorder-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease, backdrop-filter 0.3s ease;
            pointer-events: none;
        }
        .audio-recorder-overlay.active {
            display: flex;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            pointer-events: auto;
        }
        .recorder-container {
            text-align: center;
            padding: 2rem;
            border-radius: 60px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            animation: fadeInUp 0.2s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .waveform {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            height: 100px;
            margin-bottom: 1rem;
        }
        .waveform-bar {
            width: 5px;
            background: #4ade80;
            border-radius: 3px;
            transition: height 0.05s ease;
            box-shadow: 0 0 10px #4ade80;
        }
        .recorder-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 1rem 2rem;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .recorder-btn.recording {
            background: #e94560;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }
        .recorder-timer {
            font-size: 2rem;
            color: white;
            margin-bottom: 1rem;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .audio-preview {
            display: none;
            align-items: center;
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 40px;
            padding: 0.3rem 0.8rem;
            margin-right: 0.5rem;
        }
        .audio-preview.active {
            display: flex;
        }
        .audio-preview-play {
            background: none;
            border: none;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        .audio-preview-wave {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 24px;
        }
        .audio-preview-wave-bar {
            width: 3px;
            background: #4ade80;
            border-radius: 1px;
        }
        .audio-preview-delete {
            background: none;
            border: none;
            color: #e94560;
            cursor: pointer;
            font-size: 1rem;
        }

        .context-menu {
            position: fixed;
            background: rgba(30, 40, 50, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 0.5rem;
            display: flex;
            gap: 0.5rem;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .context-menu button {
            background: rgba(255,255,255,0.15);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .context-menu button:hover { background: rgba(255,255,255,0.3); }

        .media-viewer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease, backdrop-filter 0.3s ease;
        }
        .media-viewer.active {
            display: flex;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
        }
        .media-viewer-content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
            transform: scale(0.8);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), opacity 0.25s ease;
        }
        .media-viewer.active .media-viewer-content {
            transform: scale(1);
            opacity: 1;
        }
        .media-viewer-content img, .media-viewer-content video {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 20px;
        }
        .media-viewer-close {
            position: absolute;
            top: -50px;
            right: 0;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-sheet {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            background: rgba(30, 47, 62, 0.96);
            backdrop-filter: blur(20px);
            border-radius: 28px 28px 0 0;
            max-width: 500px;
            margin: 0 auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), opacity 0.2s ease;
            border-top: 1px solid rgba(255,255,255,0.2);
            z-index: 25;
            display: none;
            opacity: 0;
        }
        .modal-sheet.active {
            display: block;
            transform: translateY(0);
            opacity: 1;
        }
        .modal-handle {
            width: 50px;
            height: 5px;
            background: #7f8c8d;
            border-radius: 10px;
            margin: 12px auto 8px;
            cursor: grab;
        }
        .modal-content-inner { padding: 0 1rem 1.5rem; max-height: 55vh; overflow-y: auto; }
        .modal-title { text-align: center; color: #e0e0e0; font-size: 0.9rem; font-weight: 500; margin-bottom: 1rem; }
        .close-btn {
            background: #0a3f6f;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            margin-top: 1rem;
            cursor: pointer;
            width: 100%;
        }
        .sticker-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }
        .sticker-img {
            width: 85px;
            cursor: pointer;
            background: white;
            border-radius: 20px;
            padding: 0.3rem;
        }
        .attach-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
        }
        .attach-item {
            text-align: center;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 0.8rem 0.5rem;
        }
        .attach-icon { font-size: 2rem; filter: grayscale(100%); opacity: 0.7; }
        .attach-label { font-size: 0.7rem; color: #e0e0e0; margin-top: 0.3rem; }
        .camera-actions { display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1rem; }
        .full-width-btn {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 40px;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            color: white;
            cursor: pointer;
            text-align: center;
        }
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .photo-item {
            position: relative;
            cursor: pointer;
        }
        .photo-item img, .photo-item video {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 16px;
        }
        .photo-number {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #e94560;
            color: white;
            border-radius: 20px;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }
        .video-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0,0,0,0.6);
            color: white;
            border-radius: 20px;
            padding: 2px 6px;
            font-size: 0.6rem;
        }
        .back-btn {
            background: #0a3f6f;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 40px;
            cursor: pointer;
        }
        .empty-photo {
            text-align: center;
            padding: 1rem;
            background: rgba(255,255,255,0.15);
            border-radius: 28px;
            color: #ccc;
        }
        .seen-modal-list { display: flex; flex-direction: column; gap: 0.8rem; color: white; }
        .seen-item { display: flex; align-items: center; gap: 0.8rem; color: white; }
        .seen-avatar {
            width: 32px;
            height: 32px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .loading-spinner-overlay {
            position: relative;
            display: inline-block;
            width: 100%;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            overflow: hidden;
        }
        .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #00aaff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="chat-main-container">
    <div class="members-panel">
        <div class="members-header">👥 Участники 5А</div>
        <ul class="members-list" id="membersList"></ul>
    </div>
    <div class="chat-area" id="chatArea">
        <div class="chat-header">
            <span class="chat-title">💬 Общий чат 5 «А»</span>
            <button class="settings-btn" id="settingsBtn">⚙️ Настройки</button>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="input-panel">
            <div class="reply-bar" id="replyBar">
                <span>💬 Ответ:</span>
                <div class="reply-content" id="replyContent"></div>
                <button class="cancel-reply" id="cancelReplyBtn">✖</button>
            </div>
            <div class="input-row">
                <div class="audio-preview" id="audioPreview">
                    <button class="audio-preview-play" id="audioPreviewPlay">▶️</button>
                    <div class="audio-preview-wave" id="audioPreviewWave"></div>
                    <button class="audio-preview-delete" id="audioPreviewDelete">✖</button>
                </div>
                <input type="text" class="text-input" id="messageInput" placeholder="Сообщение...">
                <button class="icon-button" id="stickerBtn">😊</button>
                <button class="icon-button" id="attachBtn">📎</button>
                <button class="icon-button" id="sendBtn">➤</button>
            </div>
        </div>

        <div id="audioRecorderOverlay" class="audio-recorder-overlay">
            <div class="recorder-container">
                <div class="waveform" id="waveform"></div>
                <div class="recorder-timer" id="recorderTimer">0:00</div>
                <button class="recorder-btn" id="recorderBtn">🎤 Удерживайте для записи</button>
            </div>
        </div>

        <div id="stickerSheet" class="modal-sheet">
            <div class="modal-handle" id="stickerHandle"></div>
            <div class="modal-content-inner" id="stickerModalContent"></div>
        </div>

        <div id="attachSheet" class="modal-sheet">
            <div class="modal-handle" id="attachHandle"></div>
            <div class="modal-content-inner" id="attachModalContent"></div>
        </div>

        <div id="seenSheet" class="modal-sheet">
            <div class="modal-handle" id="seenHandle"></div>
            <div class="modal-content-inner" id="seenModalContent"></div>
        </div>

        <div id="deleteConfirmModal" class="modal-sheet" style="border-radius: 28px; max-width: 400px; width: 80%; left: 0; right: 0; margin: 0 auto; bottom: auto; top: 50%; transform: translateY(-50%) scale(0.9); opacity: 0; transition: 0.2s; display: none;">
            <div class="modal-content-inner" style="padding: 1.5rem;">
                <p style="color:white;">🗑️ Вы действительно хотите удалить сообщение?</p>
                <div class="quote" id="deleteQuote" style="background:rgba(255,255,255,0.1); padding:0.5rem; border-radius:16px; margin:1rem 0; color:#ddd;"></div>
                <div style="display:flex; gap:1rem; justify-content:flex-end;">
                    <button id="cancelDeleteBtn" style="background:#0a3f6f; color:white; border:none; padding:0.5rem 1rem; border-radius:40px;">Отмена</button>
                    <button id="confirmDeleteBtn" style="background:#e94560; color:white; border:none; padding:0.5rem 1rem; border-radius:40px;">Удалить</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="mediaViewer" class="media-viewer">
    <div class="media-viewer-content">
        <button class="media-viewer-close" id="mediaViewerClose">✕</button>
        <img id="mediaViewerImg" src="" style="display: none;">
        <video id="mediaViewerVideo" src="" controls style="display: none;"></video>
    </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js"></script>
<script>
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUser = null;
    let messagesUnsub = null;
    const CHAT_PATH = 'class5a_chat';
    const usersCache = new Map();
    let selectedMedia = [];
    let attachScreen = 'main';
    let pendingMessages = new Map();
    let pendingDelete = { msgId: null, msgUid: null, messageText: null };
    let onlineInterval = null;
    let replyToMsg = null;
    let contextMenu = null;
    
    // FFMPEG ДЛЯ ВИДЕО
    let ffmpeg = null;
    let ffmpegLoading = false;
    
    async function initFFmpeg() {
        if (ffmpeg) return ffmpeg;
        if (ffmpegLoading) {
            await new Promise(resolve => {
                const check = setInterval(() => {
                    if (ffmpeg) { clearInterval(check); resolve(); }
                }, 100);
            });
            return ffmpeg;
        }
        ffmpegLoading = true;
        const toast = document.createElement('div');
        toast.textContent = '⚙️ Загрузка видеокодера (25 МБ, один раз)...';
        toast.style.cssText = 'position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:white; padding:0.5rem 1rem; border-radius:40px; font-size:0.8rem; z-index:1001;';
        document.body.appendChild(toast);
        
        ffmpeg = new FFmpeg();
        await ffmpeg.load();
        
        toast.remove();
        ffmpegLoading = false;
        return ffmpeg;
    }
    
    async function compressVideo(file) {
        const ffmpegLib = await initFFmpeg();
        const name = 'input.mp4';
        const data = new Uint8Array(await file.arrayBuffer());
        ffmpegLib.FS('writeFile', name, data);
        
        await ffmpegLib.run('-i', name, '-b:v', '400k', '-vf', 'scale=480:-2', '-preset', 'fast', 'output.mp4');
        
        const output = ffmpegLib.FS('readFile', 'output.mp4');
        const blob = new Blob([output.buffer], { type: 'video/mp4' });
        return await blobToBase64(blob);
    }
    
    function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }
    
    // АУДИО ЗАПИСЬ (вызывается из скрепки)
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recordingStartTime = null;
    let audioTimer = null;
    let audioData = null;
    let audioWaveInterval = null;
    let audioContext = null;
    let audioSource = null;
    let audioAnalyser = null;
    
    function startRecordingFromSheet() {
        if (isRecording) return;
        
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                audioContext = new AudioContext();
                audioSource = audioContext.createMediaStreamSource(stream);
                audioAnalyser = audioContext.createAnalyser();
                audioAnalyser.fftSize = 256;
                audioSource.connect(audioAnalyser);
                
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = () => {
                        audioData = reader.result;
                        showAudioPreview();
                    };
                    reader.readAsDataURL(audioBlob);
                    
                    stream.getTracks().forEach(track => track.stop());
                    if (audioContext) {
                        audioContext.close();
                        audioContext = null;
                    }
                };
                
                mediaRecorder.start(100);
                isRecording = true;
                recordingStartTime = Date.now();
                
                const overlay = document.getElementById('audioRecorderOverlay');
                const recorderBtn = document.getElementById('recorderBtn');
                const timerDiv = document.getElementById('recorderTimer');
                const waveformDiv = document.getElementById('waveform');
                
                overlay.classList.add('active');
                recorderBtn.classList.add('recording');
                recorderBtn.innerHTML = '⏹ Отпустите для отправки';
                
                if (audioTimer) clearInterval(audioTimer);
                audioTimer = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    timerDiv.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                }, 100);
                
                if (audioWaveInterval) clearInterval(audioWaveInterval);
                audioWaveInterval = setInterval(() => {
                    if (!audioAnalyser || !isRecording) return;
                    const dataArray = new Uint8Array(audioAnalyser.frequencyBinCount);
                    audioAnalyser.getByteFrequencyData(dataArray);
                    const average = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
                    
                    waveformDiv.innerHTML = '';
                    for (let i = 0; i < 40; i++) {
                        const bar = document.createElement('div');
                        bar.className = 'waveform-bar';
                        const randomHeight = Math.max(10, Math.min(80, 15 + (average / 4) + Math.random() * 15));
                        bar.style.height = randomHeight + 'px';
                        bar.style.opacity = 0.6 + (average / 255) * 0.4;
                        waveformDiv.appendChild(bar);
                    }
                }, 50);
            })
            .catch(err => {
                console.error('Microphone error:', err);
                alert('Нет доступа к микрофону');
            });
    }
    
    function stopRecordingFromSheet() {
        if (!isRecording || !mediaRecorder) return;
        
        mediaRecorder.stop();
        isRecording = false;
        
        if (audioTimer) {
            clearInterval(audioTimer);
            audioTimer = null;
        }
        if (audioWaveInterval) {
            clearInterval(audioWaveInterval);
            audioWaveInterval = null;
        }
        
        const overlay = document.getElementById('audioRecorderOverlay');
        const recorderBtn = document.getElementById('recorderBtn');
        
        overlay.classList.remove('active');
        recorderBtn.classList.remove('recording');
        recorderBtn.innerHTML = '🎤 Удерживайте для записи';
        document.getElementById('recorderTimer').textContent = '0:00';
        document.getElementById('waveform').innerHTML = '';
    }
    
    function showAudioPreview() {
        const preview = document.getElementById('audioPreview');
        const waveContainer = document.getElementById('audioPreviewWave');
        
        waveContainer.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const bar = document.createElement('div');
            bar.className = 'audio-preview-wave-bar';
            bar.style.height = (5 + Math.random() * 18) + 'px';
            waveContainer.appendChild(bar);
        }
        
        preview.classList.add('active');
        
        const playBtn = document.getElementById('audioPreviewPlay');
        let isPlaying = false;
        let audio = null;
        
        playBtn.onclick = () => {
            if (isPlaying && audio) {
                audio.pause();
                isPlaying = false;
                playBtn.textContent = '▶️';
            } else {
                if (audio) {
                    audio.play();
                } else {
                    audio = new Audio(audioData);
                    audio.onended = () => {
                        isPlaying = false;
                        playBtn.textContent = '▶️';
                    };
                    audio.play();
                }
                isPlaying = true;
                playBtn.textContent = '⏸';
            }
        };
        
        document.getElementById('audioPreviewDelete').onclick = () => {
            if (audio) {
                audio.pause();
            }
            audioData = null;
            preview.classList.remove('active');
        };
    }
    
    function getAudioPreviewData() {
        return audioData;
    }
    
    function clearAudioPreview() {
        audioData = null;
        document.getElementById('audioPreview').classList.remove('active');
    }

    // ОСТАЛЬНЫЕ ФУНКЦИИ ЧАТА
    function formatDateLabel(date) {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        if (msgDate.getTime() === today.getTime()) return 'Сегодня';
        if (msgDate.getTime() === yesterday.getTime()) return 'Вчера';
        return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit' });
    }

    function getAvatarHtml(avatarBase64, name) {
        if (avatarBase64 && avatarBase64.startsWith('data:image')) return `<img src="${avatarBase64}" style="width:100%; height:100%; object-fit:cover;">`;
        return (name?.charAt(0) || '?').toUpperCase();
    }

    async function getUserData(uid) {
        if (usersCache.has(uid)) return usersCache.get(uid);
        const doc = await db.collection('users').doc(uid).get();
        const data = doc.data() || { name: 'Ученик', avatarBase64: null };
        usersCache.set(uid, data);
        return data;
    }

    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        currentUser = user;
        if (onlineInterval) clearInterval(onlineInterval);
        const updateStatus = async () => {
            await db.collection('status').doc(user.uid).set({ online: true, name: user.displayName || 'Ученик', lastSeen: new Date() }, { merge: true });
        };
        await updateStatus();
        onlineInterval = setInterval(updateStatus, 30000);
        loadMessages();
        loadMembers();
        window.addEventListener('beforeunload', () => {
            clearInterval(onlineInterval);
            db.collection('status').doc(user.uid).set({ online: false, lastSeen: new Date() }, { merge: true });
        });
    });

    async function markAsSeen(msgId) {
        const msgRef = db.collection('rooms').doc(CHAT_PATH).collection('messages').doc(msgId);
        await msgRef.update({ seenBy: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
    }

    function closeModal(sheetId) {
        const sheet = document.getElementById(sheetId);
        if (!sheet) return;
        sheet.classList.remove('active');
        setTimeout(() => { sheet.style.display = 'none'; }, 300);
    }

    function openModal(sheetId) {
        const sheet = document.getElementById(sheetId);
        if (!sheet) return;
        sheet.style.display = 'block';
        setTimeout(() => sheet.classList.add('active'), 10);
    }

    function initSwipeClose(sheetId, handleId) {
        const sheet = document.getElementById(sheetId);
        const handle = document.getElementById(handleId);
        if (!sheet || !handle) return;
        let startY = 0, startTransform = 0, dragging = false;
        const onTouchStart = (e) => {
            startY = e.touches[0].clientY;
            const transform = sheet.style.transform;
            if (transform && transform.includes('translateY')) startTransform = parseFloat(transform.match(/translateY\(([-\d]+)px\)/)?.[1] || 0);
            dragging = true;
        };
        const onTouchMove = (e) => {
            if (!dragging) return;
            const delta = e.touches[0].clientY - startY;
            if (delta > 0) sheet.style.transform = `translateY(${startTransform + delta}px)`;
        };
        const onTouchEnd = (e) => {
            if (!dragging) return;
            const delta = e.changedTouches[0].clientY - startY;
            if (delta > 60) closeModal(sheetId);
            sheet.style.transform = '';
            dragging = false;
        };
        handle.addEventListener('touchstart', onTouchStart);
        handle.addEventListener('touchmove', onTouchMove);
        handle.addEventListener('touchend', onTouchEnd);
        let mouseDown = false, mouseStartY = 0;
        handle.addEventListener('mousedown', (e) => {
            mouseDown = true;
            mouseStartY = e.clientY;
            e.preventDefault();
        });
        window.addEventListener('mousemove', (e) => {
            if (!mouseDown) return;
            const delta = e.clientY - mouseStartY;
            if (delta > 0) sheet.style.transform = `translateY(${delta}px)`;
        });
        window.addEventListener('mouseup', (e) => {
            if (!mouseDown) return;
            const delta = e.clientY - mouseStartY;
            if (delta > 60) closeModal(sheetId);
            sheet.style.transform = '';
            mouseDown = false;
        });
    }

    function scrollToMessage(msgId) {
        const messageElement = document.getElementById(msgId);
        if (!messageElement) return;
        messageElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        messageElement.classList.add('highlight');
        setTimeout(() => messageElement.classList.remove('highlight'), 1000);
    }

    function showMediaViewer(url, type, event) {
        const viewer = document.getElementById('mediaViewer');
        const img = document.getElementById('mediaViewerImg');
        const video = document.getElementById('mediaViewerVideo');
        const content = document.querySelector('.media-viewer-content');
        
        let startRect = null;
        if (event && event.target) startRect = event.target.getBoundingClientRect();
        
        img.style.display = 'none';
        video.style.display = 'none';
        
        if (type === 'image') {
            img.src = url;
            img.style.display = 'block';
        } else {
            video.src = url;
            video.style.display = 'block';
            video.load();
        }
        
        viewer.classList.add('active');
        if (startRect) {
            content.style.transform = `translate(${startRect.left + startRect.width/2 - window.innerWidth/2}px, ${startRect.top + startRect.height/2 - window.innerHeight/2}px) scale(${startRect.width / 300})`;
            content.style.opacity = '0';
            setTimeout(() => { content.style.transform = ''; content.style.opacity = ''; }, 10);
        }
    }

    function closeMediaViewer() {
        const viewer = document.getElementById('mediaViewer');
        const video = document.getElementById('mediaViewerVideo');
        const content = document.querySelector('.media-viewer-content');
        content.style.transform = 'scale(0.8)';
        content.style.opacity = '0';
        setTimeout(() => {
            viewer.classList.remove('active');
            video.pause();
            video.src = '';
            content.style.transform = '';
            content.style.opacity = '';
        }, 250);
    }

    function showContextMenu(x, y, msgData) {
        if (contextMenu) contextMenu.remove();
        contextMenu = document.createElement('div');
        contextMenu.className = 'context-menu';
        contextMenu.style.left = x + 'px';
        contextMenu.style.top = (y + 45) + 'px';
        
        const replyBtn = document.createElement('button');
        replyBtn.innerHTML = '💬 Ответить';
        replyBtn.onclick = () => {
            showReplyBar(msgData);
            contextMenu.remove();
            contextMenu = null;
        };
        
        const copyBtn = document.createElement('button');
        copyBtn.innerHTML = '📋 Копировать';
        copyBtn.onclick = () => {
            let textToCopy = msgData.text || '';
            if (msgData.images?.length) textToCopy = `📷 ${msgData.images.length} фото`;
            if (msgData.videos?.length) textToCopy = `🎥 ${msgData.videos.length} видео`;
            if (msgData.audio) textToCopy = `🎤 Голосовое сообщение`;
            if (msgData.sticker) textToCopy = `😊 Стикер`;
            navigator.clipboard.writeText(textToCopy);
            const toast = document.createElement('div');
            toast.textContent = '✅ Скопировано!';
            toast.style.position = 'fixed';
            toast.style.bottom = '100px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = 'rgba(0,0,0,0.7)';
            toast.style.color = 'white';
            toast.style.padding = '0.5rem 1rem';
            toast.style.borderRadius = '40px';
            toast.style.fontSize = '0.8rem';
            toast.style.zIndex = '1001';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
            contextMenu.remove();
            contextMenu = null;
        };
        
        contextMenu.appendChild(replyBtn);
        contextMenu.appendChild(copyBtn);
        document.body.appendChild(contextMenu);
        
        const closeHandler = (e) => {
            if (!contextMenu?.contains(e.target)) {
                contextMenu?.remove();
                contextMenu = null;
                document.removeEventListener('click', closeHandler);
                document.removeEventListener('contextmenu', closeHandler);
            }
        };
        setTimeout(() => {
            document.addEventListener('click', closeHandler);
            document.addEventListener('contextmenu', closeHandler);
        }, 10);
    }

    function showReplyBar(msg) {
        replyToMsg = msg;
        const replyBar = document.getElementById('replyBar');
        const replyContent = document.getElementById('replyContent');
        let previewText = msg.text || '';
        if (msg.images?.length) previewText = `📷 ${msg.images.length} фото`;
        if (msg.videos?.length) previewText = `🎥 ${msg.videos.length} видео`;
        if (msg.audio) previewText = `🎤 Голосовое`;
        if (msg.sticker) previewText = `😊 Стикер`;
        replyContent.innerHTML = `<strong>${msg.name || 'Ученик'}</strong>: ${previewText.substring(0, 50)}`;
        replyBar.classList.add('active');
        document.getElementById('messageInput').focus();
    }

    function cancelReply() {
        replyToMsg = null;
        document.getElementById('replyBar').classList.remove('active');
    }

    function loadMessages() {
        if (messagesUnsub) messagesUnsub();
        messagesUnsub = db.collection('rooms').doc(CHAT_PATH).collection('messages').orderBy('createdAt').onSnapshot(async (snap) => {
            const messages = [];
            for (const doc of snap.docs) messages.push({ id: doc.id, ...doc.data() });
            
            let lastDate = null;
            const container = document.getElementById('messagesArea');
            container.innerHTML = '';
            for (const m of messages) {
                const msgDate = m.createdAt?.toDate();
                if (msgDate) {
                    const dateLabel = formatDateLabel(msgDate);
                    if (dateLabel !== lastDate) {
                        const divider = document.createElement('div');
                        divider.className = 'date-divider';
                        divider.innerHTML = `<div class="date-badge">${dateLabel}</div>`;
                        container.appendChild(divider);
                        lastDate = dateLabel;
                    }
                }
                const mine = m.uid === currentUser?.uid;
                const userData = await getUserData(m.uid);
                const avatarHtml = getAvatarHtml(userData.avatarBase64, userData.name || m.name);
                
                let replyHtml = '';
                let replyToId = null;
                if (m.replyTo) {
                    replyToId = m.replyTo.id;
                    const repliedUserName = m.replyTo.name || 'Пользователь';
                    let repliedText = m.replyTo.text || '';
                    if (m.replyTo.images?.length) repliedText = `📷 фото`;
                    if (m.replyTo.videos?.length) repliedText = `🎥 видео`;
                    if (m.replyTo.audio) repliedText = `🎤 голосовое`;
                    if (m.replyTo.sticker) repliedText = `😊 Стикер`;
                    replyHtml = `<div class="reply-preview" data-reply-to-id="${replyToId}"><div class="reply-author">→ ${repliedUserName}</div><div class="reply-text">${repliedText.substring(0, 50)}</div></div>`;
                }
                
                let mediaHtml = '';
                if (m.images?.length) {
                    mediaHtml = `<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:4px; max-width:260px;">`;
                    for (let img of m.images) {
                        mediaHtml += `<img src="${img}" class="clickable-media" data-type="image" data-url="${img}" style="width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px; cursor:pointer;">`;
                    }
                    mediaHtml += `</div>`;
                }
                if (m.videos?.length) {
                    for (let vid of m.videos) {
                        mediaHtml += `
                            <div style="margin-top: 8px;">
                                <video class="clickable-media" data-type="video" data-url="${vid}" 
                                       src="${vid}" 
                                       style="width: 280px; max-width: 100%; max-height: 280px; border-radius: 16px; cursor: pointer; background: #000;"
                                       preload="metadata"
                                       controls>
                                </video>
                            </div>
                        `;
                    }
                }
                if (m.audio) {
                    mediaHtml += `
                        <div class="audio-player" data-audio-url="${m.audio}">
                            <button class="audio-play-btn">▶️</button>
                            <div class="audio-wave"></div>
                            <span class="audio-duration">${m.audioDuration || '0:00'}</span>
                        </div>
                    `;
                }
                if (m.sticker) mediaHtml += `<img src="${m.sticker}" style="max-width:130px; cursor:pointer;" class="clickable-media" data-type="image" data-url="${m.sticker}">`;
                
                const seenCount = (m.seenBy || []).filter(uid => uid !== m.uid).length;
                const statusHtml = seenCount > 0 ? '<span class="delivered">✅✅</span>' : '<span class="sent">⌛</span>';
                const div = document.createElement('div');
                div.className = `message ${mine ? 'mine' : ''}`;
                div.id = m.id;
                div.innerHTML = `<div class="msg-avatar">${avatarHtml}</div><div class="msg-bubble">${replyHtml}<div class="msg-name">${userData.name || m.name || 'Ученик'}</div><div class="msg-text">${mediaHtml} ${m.text || ''}</div><div class="msg-footer"><div class="status-icons">${statusHtml}</div><div class="msg-actions"><button class="delete-btn" data-msg-id="${m.id}" data-msg-uid="${m.uid}" data-msg-text="${escapeHtml(m.text || 'Фото/видео/голосовое/стикер')}">🗑️</button><button class="seen-btn" data-msg-id="${m.id}">👁️</button></div></div><div class="msg-time">${m.createdAt?.toDate().toLocaleTimeString() || ''}</div></div>`;
                container.appendChild(div);
                
                div.querySelectorAll('.audio-player').forEach(player => {
                    const audioUrl = player.getAttribute('data-audio-url');
                    const playBtn = player.querySelector('.audio-play-btn');
                    const waveContainer = player.querySelector('.audio-wave');
                    let isPlaying = false;
                    let audio = null;
                    
                    for (let i = 0; i < 20; i++) {
                        const bar = document.createElement('div');
                        bar.className = 'audio-wave-bar';
                        bar.style.height = (5 + Math.random() * 15) + 'px';
                        waveContainer.appendChild(bar);
                    }
                    
                    playBtn.addEventListener('click', () => {
                        if (isPlaying && audio) {
                            audio.pause();
                            isPlaying = false;
                            playBtn.textContent = '▶️';
                        } else {
                            if (audio) {
                                audio.play();
                            } else {
                                audio = new Audio(audioUrl);
                                audio.onended = () => {
                                    isPlaying = false;
                                    playBtn.textContent = '▶️';
                                };
                                audio.play();
                            }
                            isPlaying = true;
                            playBtn.textContent = '⏸';
                        }
                    });
                });
                
                div.querySelectorAll('.clickable-media').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const type = el.getAttribute('data-type');
                        const url = el.getAttribute('data-url');
                        showMediaViewer(url, type, e);
                    });
                });
                
                const replyBlock = div.querySelector('.reply-preview');
                if (replyBlock && replyToId) {
                    replyBlock.addEventListener('click', (e) => {
                        e.stopPropagation();
                        scrollToMessage(replyToId);
                    });
                }
                
                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    showContextMenu(e.clientX, e.clientY, {
                        id: m.id,
                        text: m.text || '',
                        name: userData.name || m.name,
                        uid: m.uid,
                        images: m.images,
                        videos: m.videos,
                        audio: m.audio,
                        sticker: m.sticker
                    });
                });
                
                let pressTimer;
                div.addEventListener('touchstart', (e) => {
                    pressTimer = setTimeout(() => {
                        const touch = e.touches[0];
                        showContextMenu(touch.clientX, touch.clientY, {
                            id: m.id,
                            text: m.text || '',
                            name: userData.name || m.name,
                            uid: m.uid,
                            images: m.images,
                            videos: m.videos,
                            audio: m.audio,
                            sticker: m.sticker
                        });
                    }, 500);
                });
                div.addEventListener('touchend', () => clearTimeout(pressTimer));
                div.addEventListener('touchmove', () => clearTimeout(pressTimer));
                
                div.querySelector('.delete-btn')?.addEventListener('click', (e) => {
                    e.stopPropagation();
                    pendingDelete = { msgId: m.id, msgUid: m.uid, messageText: m.text || 'Фото/видео/голосовое/стикер' };
                    document.getElementById('deleteQuote').textContent = (m.text || 'Фото/видео/голосовое/стикер').substring(0, 100);
                    openModal('deleteConfirmModal');
                });
                div.querySelector('.seen-btn')?.addEventListener('click', async (e) => {
                    const users = [];
                    for (const uid of (m.seenBy || [])) if (uid !== currentUser?.uid) {
                        const userData = await getUserData(uid);
                        users.push(userData.name || 'Ученик');
                    }
                    document.getElementById('seenModalContent').innerHTML = `<div class="modal-title">👁️ Просмотрено</div><div class="seen-modal-list">${users.map(u => `<div class="seen-item"><div class="seen-avatar">${u.charAt(0)}</div><span>${u}</span></div>`).join('')}</div><button class="close-btn" id="seenCloseBtn">Закрыть</button>`;
                    document.getElementById('seenCloseBtn').onclick = () => closeModal('seenSheet');
                    openModal('seenSheet');
                });
            }
            
            for (let [tempId, pending] of pendingMessages.entries()) {
                if (!document.getElementById(tempId)) {
                    const userData = await getUserData(currentUser.uid);
                    const avatarHtml = getAvatarHtml(userData.avatarBase64, userData.name);
                    let mediaHtml = '';
                    if (pending.images?.length) {
                        mediaHtml = `<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:4px; max-width:260px;">`;
                        for (let img of pending.images) mediaHtml += `<div class="loading-spinner-overlay" style="position:relative; display:block; width:100%; aspect-ratio:1; border-radius:12px; overflow:hidden;"><img src="${img}" style="width:100%; aspect-ratio:1; object-fit:cover; filter: brightness(0.5) blur(4px);"><div class="spinner"></div></div>`;
                        mediaHtml += `</div>`;
                    }
                    if (pending.videos?.length) {
                        for (let i = 0; i < pending.videos.length; i++) {
                            mediaHtml += `<div class="loading-spinner-overlay" style="position:relative; display:block; width:280px; max-width:100%; aspect-ratio:16/9; border-radius:16px; overflow:hidden; background:#000; margin-top:8px;"><div class="spinner"></div></div>`;
                        }
                    }
                    if (pending.audio) {
                        mediaHtml += `<div class="audio-player"><button class="audio-play-btn">▶️</button><div class="audio-wave"></div><span class="audio-duration">${pending.audioDuration || '0:00'}</span></div>`;
                    }
                    const div = document.createElement('div');
                    div.className = 'message mine';
                    div.id = tempId;
                    div.innerHTML = `<div class="msg-avatar">${avatarHtml}</div><div class="msg-bubble"><div class="msg-name">${userData.name || currentUser.displayName || 'Ученик'}</div><div class="msg-text">${mediaHtml} ${pending.text || ''}</div><div class="msg-footer"><div class="status-icons"><span class="sent">⌛</span>${pending.progress ? `<span class="progress-bar">${pending.progress}%</span>` : ''}</div></div><div class="msg-time">отправляется...</div></div>`;
                    container.appendChild(div);
                }
            }
            container.scrollTop = container.scrollHeight;
            
            for (const change of snap.docChanges()) {
                const m = change.doc.data();
                if (change.type === 'added' && m.uid !== currentUser.uid) {
                    if (!m.seenBy || !m.seenBy.includes(currentUser.uid)) {
                        await markAsSeen(change.doc.id);
                    }
                }
            }
        });
    }

    async function loadMembers() {
        db.collection('status').onSnapshot(async (snap) => {
            const container = document.getElementById('membersList');
            container.innerHTML = '';
            for (const doc of snap.docs) {
                const status = doc.data();
                const userData = await getUserData(doc.id);
                const avatarHtml = getAvatarHtml(userData.avatarBase64, userData.name);
                const isOnline = status.online && (new Date() - (status.lastSeen?.toDate?.() || 0) < 60000);
                const statusText = isOnline ? '🟢 Онлайн' : (status.lastSeen ? `⚫ Был(а) ${status.lastSeen.toDate().toLocaleTimeString()}` : '⚫ Офлайн');
                container.innerHTML += `<li class="member-item"><div class="member-avatar">${avatarHtml}</div><div class="member-info"><div class="member-name">${userData.name || status.name || 'Ученик'}</div><div class="member-status ${isOnline ? 'online-status' : 'offline-status'}">${statusText}</div></div></li>`;
            }
        });
    }

    async function sendMessageOptimistic(text, imagesArray, videosArray, audioDataUrl = null, audioDuration = null, stickerUrl = null) {
        const tempId = 'temp_' + Date.now() + '_' + Math.random();
        const userData = await getUserData(currentUser.uid);
        const replyData = replyToMsg ? {
            id: replyToMsg.id,
            text: replyToMsg.text || (replyToMsg.images ? '📷 Фото' : (replyToMsg.videos ? '🎥 Видео' : (replyToMsg.audio ? '🎤 Голосовое' : (replyToMsg.sticker ? '😊 Стикер' : '')))),
            name: replyToMsg.name,
            uid: replyToMsg.uid
        } : null;
        
        pendingMessages.set(tempId, { text: text || '', images: imagesArray || [], videos: videosArray || [], audio: audioDataUrl, audioDuration: audioDuration, progress: 0 });
        loadMessages();
        
        let uploadedVideos = [];
        if (videosArray && videosArray.length) {
            for (let i = 0; i < videosArray.length; i++) {
                const pending = pendingMessages.get(tempId);
                if (pending) pending.progress = Math.floor((i / videosArray.length) * 50);
                
                try {
                    const fileBlob = await (await fetch(videosArray[i])).blob();
                    const file = new File([fileBlob], 'video.mp4', { type: 'video/mp4' });
                    const compressed = await compressVideo(file);
                    uploadedVideos.push(compressed);
                    if (pending) pending.progress = 50 + Math.floor(((i + 1) / videosArray.length) * 40);
                } catch (err) {
                    console.error('Ошибка сжатия:', err);
                    alert(`Ошибка сжатия видео: ${err.message || 'неизвестная ошибка'}`);
                    pendingMessages.delete(tempId);
                    loadMessages();
                    return;
                }
            }
        }
        
        let uploadedImages = imagesArray || [];
        let uploadedAudio = audioDataUrl;
        let uploadedAudioDuration = audioDuration;
        
        try {
            await db.collection('rooms').doc(CHAT_PATH).collection('messages').add({
                text: text || '', images: uploadedImages, videos: uploadedVideos, audio: uploadedAudio, audioDuration: uploadedAudioDuration, sticker: stickerUrl,
                uid: currentUser.uid, name: userData.name || currentUser.displayName || 'Ученик',
                seenBy: [currentUser.uid], createdAt: new Date(),
                replyTo: replyData
            });
            pendingMessages.delete(tempId);
            cancelReply();
            loadMessages();
        } catch (err) {
            console.error('Ошибка:', err);
            pendingMessages.delete(tempId);
            loadMessages();
            alert('Ошибка отправки: ' + (err.message || 'неизвестная ошибка'));
        }
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, (m) => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

    function renderStickerModal() {
        const container = document.getElementById('stickerModalContent');
        if (!container) return;
        container.innerHTML = `<div class="modal-title">✨ Стикеры</div><div id="stickerList" class="sticker-grid"></div><button class="close-btn" id="stickerModalCloseBtn">Закрыть</button>`;
        const stickers = ['stickers/okay.gif'];
        document.getElementById('stickerList').innerHTML = stickers.map(s => `<img src="${s}" class="sticker-img" data-sticker-url="${s}">`).join('');
        document.querySelectorAll('#stickerList .sticker-img').forEach(img => {
            img.onclick = (e) => {
                e.stopPropagation();
                sendMessageOptimistic('', null, null, null, null, img.getAttribute('data-sticker-url'));
                closeModal('stickerSheet');
            };
        });
        document.getElementById('stickerModalCloseBtn').onclick = (e) => { e.preventDefault(); closeModal('stickerSheet'); };
    }

    function renderAttachMain() {
        const container = document.getElementById('attachModalContent');
        if (!container) return;
        container.innerHTML = `
            <div class="modal-title">📎 Отправить</div>
            <div class="attach-grid">
                <div class="attach-item" data-type="camera"><div class="attach-icon">📷</div><div class="attach-label">Камера</div></div>
                <div class="attach-item" data-type="video"><div class="attach-icon">🎥</div><div class="attach-label">Видео</div></div>
                <div class="attach-item" data-type="file"><div class="attach-icon">📄</div><div class="attach-label">Файл</div></div>
                <div class="attach-item" data-type="poll"><div class="attach-icon">📊</div><div class="attach-label">Опрос</div></div>
                <div class="attach-item" data-type="voice"><div class="attach-icon">🎤</div><div class="attach-label">Голос</div></div>
                <div class="attach-item" data-type="link"><div class="attach-icon">🔗</div><div class="attach-label">Ссылка</div></div>
            </div>
            <button class="close-btn" id="attachModalCloseBtn">Закрыть</button>
        `;
        document.querySelectorAll('.attach-item').forEach(el => {
            el.onclick = (e) => {
                e.stopPropagation();
                if (el.dataset.type === 'camera') {
                    attachScreen = 'camera';
                    renderCameraScreen();
                } else if (el.dataset.type === 'video') {
                    attachScreen = 'video';
                    renderVideoScreen();
                } else if (el.dataset.type === 'voice') {
                    startRecordingFromSheet();
                    const overlay = document.getElementById('audioRecorderOverlay');
                    const recorderBtn = document.getElementById('recorderBtn');
                    
                    const stopHandler = () => {
                        stopRecordingFromSheet();
                        recorderBtn.removeEventListener('mouseup', stopHandler);
                        recorderBtn.removeEventListener('touchend', stopHandler);
                        overlay.removeEventListener('mouseleave', stopHandler);
                    };
                    
                    recorderBtn.addEventListener('mouseup', stopHandler);
                    recorderBtn.addEventListener('touchend', stopHandler);
                    overlay.addEventListener('mouseleave', stopHandler);
                } else {
                    alert(`📎 Отправка ${el.dataset.type} — в разработке`);
                    closeModal('attachSheet');
                }
            };
        });
        document.getElementById('attachModalCloseBtn').onclick = (e) => { closeModal('attachSheet'); };
    }

    function renderCameraScreen() {
        const container = document.getElementById('attachModalContent');
        if (!container) return;
        container.innerHTML = `
            <div class="attach-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <button class="back-btn" id="cameraBackBtn">← Назад</button>
                <span class="modal-title">Снять фото</span>
                <div style="width:50px;"></div>
            </div>
            <div id="photoGallery" class="photo-gallery"></div>
            <div class="camera-actions">
                <button class="full-width-btn" id="openCameraBtn">📷 Сфотографировать</button>
                <button class="full-width-btn" id="selectFromGalleryBtn">📁 Выбрать из галереи</button>
            </div>
            <button class="close-btn" id="attachModalCloseBtn" style="margin-top:10px;">Закрыть</button>
        `;
        renderMediaGallery();
        document.getElementById('cameraBackBtn').onclick = () => { attachScreen = 'main'; renderAttachMain(); };
        document.getElementById('openCameraBtn').onclick = () => showCameraModal('image');
        document.getElementById('selectFromGalleryBtn').onclick = () => {
            const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
            input.onchange = (e) => { if (e.target.files) addFiles(e.target.files, 'image'); input.remove(); };
            input.click();
        };
        document.getElementById('attachModalCloseBtn').onclick = (e) => { closeModal('attachSheet'); };
    }

    function renderVideoScreen() {
        const container = document.getElementById('attachModalContent');
        if (!container) return;
        container.innerHTML = `
            <div class="attach-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <button class="back-btn" id="videoBackBtn">← Назад</button>
                <span class="modal-title">Записать видео</span>
                <div style="width:50px;"></div>
            </div>
            <div id="videoGallery" class="photo-gallery"></div>
            <div class="camera-actions">
                <button class="full-width-btn" id="recordVideoBtn">🎥 Записать видео</button>
                <button class="full-width-btn" id="selectVideoFromGalleryBtn">📁 Выбрать из галереи</button>
            </div>
            <button class="close-btn" id="attachModalCloseBtn" style="margin-top:10px;">Закрыть</button>
        `;
        renderMediaGallery();
        document.getElementById('videoBackBtn').onclick = () => { attachScreen = 'main'; renderAttachMain(); };
        document.getElementById('recordVideoBtn').onclick = () => showCameraModal('video');
        document.getElementById('selectVideoFromGalleryBtn').onclick = () => {
            const input = document.createElement('input'); input.type = 'file'; input.accept = 'video/*'; input.multiple = true;
            input.onchange = (e) => { if (e.target.files) addFiles(e.target.files, 'video'); input.remove(); };
            input.click();
        };
        document.getElementById('attachModalCloseBtn').onclick = (e) => { closeModal('attachSheet'); };
    }

    function renderMediaGallery() {
        const gallery = document.getElementById('photoGallery') || document.getElementById('videoGallery');
        if (!gallery) return;
        if (!selectedMedia.length) { gallery.innerHTML = '<div class="empty-photo">😕 Нет выбранных медиа</div>'; return; }
        gallery.innerHTML = '';
        for (let i = 0; i < selectedMedia.length; i++) {
            const media = selectedMedia[i];
            const div = document.createElement('div'); div.className = 'photo-item';
            if (media.type === 'image') {
                const img = document.createElement('img'); img.src = media.data;
                div.appendChild(img);
            } else {
                const video = document.createElement('video'); video.src = media.data; video.preload = 'metadata';
                video.style.width = '100%'; video.style.aspectRatio = '1'; video.style.objectFit = 'cover';
                video.style.borderRadius = '16px';
                div.appendChild(video);
                const badge = document.createElement('div'); badge.className = 'video-badge'; badge.textContent = '🎥';
                div.appendChild(badge);
            }
            const numberSpan = document.createElement('div'); numberSpan.className = 'photo-number'; numberSpan.textContent = i + 1;
            div.appendChild(numberSpan);
            div.onclick = () => { selectedMedia.splice(i, 1); renderMediaGallery(); };
            gallery.appendChild(div);
        }
    }

    function addFiles(files, type) {
        const newFiles = Array.from(files);
        const remaining = 8 - selectedMedia.length;
        const toAdd = newFiles.slice(0, remaining);
        for (const file of toAdd) {
            const reader = new FileReader();
            reader.onload = (e) => { selectedMedia.push({ type: type, data: e.target.result }); renderMediaGallery(); };
            reader.readAsDataURL(file);
        }
        if (newFiles.length > remaining) alert(`Можно выбрать до 8 медиафайлов. Добавлено ${remaining}.`);
    }

    function showCameraModal(mediaType) {
        const isVideo = mediaType === 'video';
        const origContent = document.getElementById('attachModalContent').innerHTML;
        
        document.getElementById('attachModalContent').innerHTML = `
            <div class="preview-header" style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                <button class="back-btn" id="cameraBackBtn" style="background:#0a3f6f;">← Назад</button>
                <span class="modal-title">${isVideo ? 'Запись видео' : 'Снять фото'}</span>
                <button class="rotate-btn" id="rotateCameraBtn" style="background:#0a3f6f; border:none; border-radius:40px; padding:0.3rem 0.8rem; color:white; cursor:pointer;">🔄</button>
            </div>
            <video id="cameraVideo" autoplay playsinline style="width:100%; border-radius:24px; background:#000;"></video>
            <div class="camera-actions" style="margin-top:1rem;">
                <button class="full-width-btn" id="captureBtn">${isVideo ? '⏺ Начать запись' : '📸 Сделать снимок'}</button>
                ${isVideo ? '<button class="full-width-btn" id="stopRecordBtn" style="display:none;">⏹ Остановить запись</button>' : ''}
            </div>
            <button class="close-btn" id="cameraCloseBtn">Закрыть</button>
        `;
        
        let facingMode = 'environment', stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        
        const startCamera = async () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: facingMode } }, audio: isVideo });
            } catch {
                try { stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: isVideo }); }
                catch(e) { alert('Нет доступа к камере'); return; }
            }
            document.getElementById('cameraVideo').srcObject = stream;
        };
        startCamera();
        
        document.getElementById('cameraBackBtn').onclick = () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('attachModalContent').innerHTML = origContent;
            renderMediaGallery();
            if (isVideo) renderVideoScreen();
            else renderCameraScreen();
        };
        
        document.getElementById('rotateCameraBtn').onclick = () => {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        };
        
        if (!isVideo) {
            document.getElementById('captureBtn').onclick = () => {
                const video = document.getElementById('cameraVideo');
                if (!video) return;
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const dataUrl = canvas.toDataURL('image/jpeg');
                if (selectedMedia.length < 8) {
                    selectedMedia.push({ type: 'image', data: dataUrl });
                    renderMediaGallery();
                } else alert('Максимум 8 медиафайлов');
            };
        } else {
            const captureBtn = document.getElementById('captureBtn');
            const stopBtn = document.getElementById('stopRecordBtn');
            captureBtn.onclick = () => {
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        if (selectedMedia.length < 8) {
                            selectedMedia.push({ type: 'video', data: e.target.result });
                            renderMediaGallery();
                        } else alert('Максимум 8 медиафайлов');
                    };
                    reader.readAsDataURL(blob);
                    captureBtn.style.display = 'block';
                    stopBtn.style.display = 'none';
                };
                mediaRecorder.start();
                captureBtn.style.display = 'none';
                stopBtn.style.display = 'block';
            };
            stopBtn.onclick = () => {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
            };
        }
        
        document.getElementById('cameraCloseBtn').onclick = () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('attachModalContent').innerHTML = origContent;
            renderMediaGallery();
            if (isVideo) renderVideoScreen();
            else renderCameraScreen();
        };
    }

    initSwipeClose('stickerSheet', 'stickerHandle');
    initSwipeClose('attachSheet', 'attachHandle');
    initSwipeClose('seenSheet', 'seenHandle');

    document.getElementById('cancelDeleteBtn').onclick = () => closeModal('deleteConfirmModal');
    document.getElementById('confirmDeleteBtn').onclick = async () => {
        closeModal('deleteConfirmModal');
        if (!pendingDelete.msgId) return;
        const isMine = pendingDelete.msgUid === currentUser.uid;
        if (!isMine) {
            const password = prompt('🔐 Это чужое сообщение. Введите пароль модератора:');
            if (password !== 'КИКИ99СССР') { alert('Неверный пароль!'); return; }
        }
        await db.collection('rooms').doc(CHAT_PATH).collection('messages').doc(pendingDelete.msgId).delete();
    };

    document.getElementById('mediaViewerClose').onclick = closeMediaViewer;
    document.getElementById('mediaViewer').addEventListener('click', (e) => {
        if (e.target === document.getElementById('mediaViewer')) closeMediaViewer();
    });
    
    document.getElementById('cancelReplyBtn').onclick = cancelReply;
    document.getElementById('stickerBtn').onclick = () => { renderStickerModal(); openModal('stickerSheet'); };
    document.getElementById('attachBtn').onclick = () => { attachScreen = 'main'; selectedMedia = []; renderAttachMain(); openModal('attachSheet'); };
    document.getElementById('sendBtn').onclick = async () => {
        const text = document.getElementById('messageInput').value;
        const images = selectedMedia.filter(m => m.type === 'image').map(m => m.data);
        const videos = selectedMedia.filter(m => m.type === 'video').map(m => m.data);
        const audio = getAudioPreviewData();
        const audioDuration = document.getElementById('recorderTimer')?.textContent || null;
        
        if (audio) {
            await sendMessageOptimistic(text, images, videos, audio, audioDuration);
            clearAudioPreview();
            selectedMedia = [];
            document.getElementById('messageInput').value = '';
            closeModal('attachSheet');
        } else if (selectedMedia.length) {
            await sendMessageOptimistic(text, images, videos);
            selectedMedia = [];
            document.getElementById('messageInput').value = '';
            closeModal('attachSheet');
        } else if (text.trim()) {
            await sendMessageOptimistic(text, null, null);
            document.getElementById('messageInput').value = '';
        }
    };
    document.getElementById('settingsBtn').onclick = () => window.location.href = 'settings.html';
</script>
