<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Чат 5А | Школа №15</title>
    <link rel="stylesheet" href="common.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: url('images/fon.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        .chat-main-container {
            width: 1400px;
            max-width: 98vw;
            height: 90vh;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .members-panel {
            width: 280px;
            background: rgba(10, 30, 50, 0.3);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .members-header {
            padding: 1.5rem 1rem;
            font-weight: bold;
            color: white;
            background: rgba(0, 0, 0, 0.2);
            font-size: 1.1rem;
        }

        .members-list {
            flex: 1;
            list-style: none;
            padding: 0.5rem;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 0.5rem;
        }

        .member-avatar {
            width: 44px;
            height: 44px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            overflow: hidden;
        }

        .member-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .member-info {
            flex: 1;
        }

        .member-name {
            font-weight: 600;
            color: white;
            font-size: 0.9rem;
        }

        .member-status {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .online-status {
            color: #4ade80;
        }

        .offline-status {
            color: #9ca3af;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
        }

        .chat-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .chat-title {
            font-weight: bold;
            color: white;
            font-size: 1.1rem;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .message {
            display: flex;
            gap: 0.6rem;
            align-items: flex-start;
            max-width: 80%;
        }

        .message.mine {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.7rem;
            overflow: hidden;
        }

        .msg-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .msg-bubble {
            background: rgba(255, 255, 255, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            color: #1e2f3e;
        }

        .message.mine .msg-bubble {
            background: #0a3f6f;
            color: white;
        }

        .msg-name {
            font-size: 0.65rem;
            font-weight: bold;
            margin-bottom: 0.2rem;
        }

        .msg-text {
            font-size: 0.9rem;
        }

        .msg-time {
            font-size: 0.6rem;
            opacity: 0.6;
            margin-top: 0.2rem;
            text-align: right;
        }

        .input-panel {
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            gap: 0.6rem;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .icon-button {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 40px;
            font-size: 1.3rem;
            cursor: pointer;
        }

        .text-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 40px;
            padding: 0.7rem 1rem;
            font-size: 0.9rem;
            outline: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-bottom {
            background: #d4e8fc;
            width: 100%;
            border-radius: 32px 32px 0 0;
            padding: 1.5rem;
            max-height: 70vh;
            overflow-y: auto;
        }

        .sticker-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .sticker-img {
            width: 90px;
            cursor: pointer;
            background: white;
            border-radius: 20px;
            padding: 0.3rem;
        }

        .close-btn {
            background: #0a3f6f;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            margin-top: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-main-container">
    <div class="members-panel">
        <div class="members-header">👥 Участники 5А</div>
        <ul class="members-list" id="membersList"></ul>
    </div>
    <div class="chat-area">
        <div class="chat-header">
            <span class="chat-title">💬 Общий чат 5 «А»</span>
            <button class="settings-btn" id="settingsBtn">⚙️ Настройки</button>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="input-panel">
            <button class="icon-button" id="stickerBtn">😊</button>
            <input type="text" class="text-input" id="messageInput" placeholder="Сообщение...">
            <button class="icon-button" id="attachBtn">📎</button>
            <button class="icon-button" id="sendBtn">➤</button>
        </div>
    </div>
</div>

<div id="stickerModal" class="modal">
    <div class="modal-bottom">
        <h3>Выбери стикер</h3>
        <div id="stickerList" class="sticker-grid"></div>
        <button class="close-btn" onclick="closeModal('stickerModal')">Закрыть</button>
    </div>
</div>

<div id="attachModal" class="modal">
    <div class="modal-bottom">
        <h3>Отправить файл</h3>
        <div class="sticker-grid" style="grid-template-columns: repeat(3,1fr);">
            <div style="text-align:center"><div class="icon-button" style="font-size:2rem;">📷</div><div>Фото</div></div>
            <div style="text-align:center"><div class="icon-button" style="font-size:2rem;">🎥</div><div>Видео</div></div>
            <div style="text-align:center"><div class="icon-button" style="font-size:2rem;">📄</div><div>Файл</div></div>
            <div style="text-align:center"><div class="icon-button" style="font-size:2rem;">📊</div><div>Опрос</div></div>
            <div style="text-align:center"><div class="icon-button" style="font-size:2rem;">🎤</div><div>Голос</div></div>
            <div style="text-align:center"><div class="icon-button" style="font-size:2rem;">🔗</div><div>Ссылка</div></div>
        </div>
        <button class="close-btn" onclick="closeModal('attachModal')">Отмена</button>
    </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUser = null;
    let messagesUnsub = null;

    // ✅ ПРАВИЛЬНЫЙ ПУТЬ К СООБЩЕНИЯМ (class5a_chat)
    const CHAT_PATH = 'class5a_chat';
    
    const usersCache = new Map();

    async function getUserData(uid) {
        if (usersCache.has(uid)) return usersCache.get(uid);
        const doc = await db.collection('users').doc(uid).get();
        const data = doc.data() || { name: 'Ученик', avatarUrl: null };
        usersCache.set(uid, data);
        return data;
    }

    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        currentUser = user;
        await db.collection('status').doc(user.uid).set({ 
            online: true, 
            name: user.displayName || 'Ученик',
            lastSeen: new Date()
        }, { merge: true });
        
        loadMessages();
        loadMembers();
        
        window.addEventListener('beforeunload', () => {
            db.collection('status').doc(user.uid).set({ online: false }, { merge: true });
        });
    });

    function loadMessages() {
        if (messagesUnsub) messagesUnsub();
        messagesUnsub = db.collection('rooms').doc(CHAT_PATH).collection('messages')
            .orderBy('createdAt')
            .onSnapshot(async (snap) => {
                const container = document.getElementById('messagesArea');
                container.innerHTML = '';
                for (const doc of snap.docs) {
                    const m = doc.data();
                    const mine = m.uid === currentUser?.uid;
                    const userData = await getUserData(m.uid);
                    const avatarContent = userData.avatarUrl ? `<img src="${userData.avatarUrl}">` : (userData.name?.charAt(0) || '?');
                    const div = document.createElement('div');
                    div.className = `message ${mine ? 'mine' : ''}`;
                    div.innerHTML = `
                        <div class="msg-avatar">${avatarContent}</div>
                        <div class="msg-bubble">
                            <div class="msg-name">${userData.name || m.name || 'Ученик'}</div>
                            <div class="msg-text">${m.sticker ? `<img src="${m.sticker}" style="max-width:130px">` : (m.text || '')}</div>
                            <div class="msg-time">${m.createdAt?.toDate().toLocaleTimeString() || ''}</div>
                        </div>
                    `;
                    container.appendChild(div);
                }
                container.scrollTop = container.scrollHeight;
            }, err => console.error('Ошибка сообщений:', err));
    }

    async function loadMembers() {
        db.collection('status').onSnapshot(async (snap) => {
            const container = document.getElementById('membersList');
            container.innerHTML = '';
            for (const doc of snap.docs) {
                const status = doc.data();
                const userData = await getUserData(doc.id);
                const avatarContent = userData.avatarUrl ? `<img src="${userData.avatarUrl}">` : (userData.name?.charAt(0) || '?');
                container.innerHTML += `
                    <li class="member-item">
                        <div class="member-avatar">${avatarContent}</div>
                        <div class="member-info">
                            <div class="member-name">${userData.name || status.name || 'Ученик'}</div>
                            <div class="member-status ${status.online ? 'online-status' : 'offline-status'}">${status.online ? '🟢 Онлайн' : '⚫ Офлайн'}</div>
                        </div>
                    </li>
                `;
            }
        });
    }

    async function sendMessage(text, stickerUrl = null) {
        if (!text.trim() && !stickerUrl) return;
        const userData = await getUserData(currentUser.uid);
        await db.collection('rooms').doc(CHAT_PATH).collection('messages').add({
            text: text,
            sticker: stickerUrl,
            uid: currentUser.uid,
            name: userData.name || currentUser.displayName || 'Ученик',
            createdAt: new Date()
        });
    }

    function loadStickers() {
        const stickers = ['stickers/okay.gif'];
        const container = document.getElementById('stickerList');
        container.innerHTML = stickers.map(s => `<img src="${s}" class="sticker-img" onclick="sendSticker('${s}')">`).join('');
    }
    
    window.sendSticker = (url) => {
        sendMessage('', url);
        closeModal('stickerModal');
    };
    
    window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    document.getElementById('stickerBtn').onclick = () => { 
        loadStickers(); 
        document.getElementById('stickerModal').style.display = 'flex'; 
    };
    
    document.getElementById('attachBtn').onclick = () => document.getElementById('attachModal').style.display = 'flex';
    
    document.getElementById('sendBtn').onclick = () => {
        const inp = document.getElementById('messageInput');
        if (inp.value.trim()) sendMessage(inp.value);
        inp.value = '';
    };
    
    document.getElementById('settingsBtn').onclick = () => window.location.href = 'settings.html';
</script>
</body>
</html>
