<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Чат 5А | Школа №15</title>
    <link rel="stylesheet" href="common.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: url('images/fon.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .chat-main-container {
            width: 1400px;
            max-width: 98vw;
            height: 90vh;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* ЛЕВАЯ ПАНЕЛЬ — УЧАСТНИКИ */
        .members-panel {
            width: 280px;
            background: rgba(10, 30, 50, 0.3);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .members-header {
            padding: 1.5rem 1rem;
            font-weight: bold;
            color: white;
            background: rgba(0, 0, 0, 0.2);
            font-size: 1.1rem;
        }

        .members-list {
            flex: 1;
            list-style: none;
            padding: 0.5rem;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 0.5rem;
        }

        .member-avatar {
            width: 44px;
            height: 44px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
        }

        .member-info {
            flex: 1;
        }

        .member-name {
            font-weight: 600;
            color: white;
            font-size: 0.9rem;
        }

        .member-status {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .online-status { color: #4ade80; }
        .offline-status { color: #9ca3af; }

        /* ПРАВАЯ ЗОНА — ЧАТ */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
        }

        .chat-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .chat-title {
            font-weight: bold;
            color: white;
            font-size: 1.1rem;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .settings-btn:hover { background: rgba(255,255,255,0.4); }

        /* ЛЕНТА СООБЩЕНИЙ */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .message {
            display: flex;
            gap: 0.6rem;
            align-items: flex-start;
            max-width: 80%;
        }
        .message.mine {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-avatar {
            width: 32px;
            height: 32px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .msg-bubble {
            background: rgba(255, 255, 255, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            color: #1e2f3e;
            word-wrap: break-word;
        }
        .message.mine .msg-bubble {
            background: #0a3f6f;
            color: white;
        }
        .msg-name {
            font-size: 0.65rem;
            font-weight: bold;
            opacity: 0.8;
            margin-bottom: 0.2rem;
        }
        .msg-text { font-size: 0.9rem; }
        .msg-time { font-size: 0.6rem; opacity: 0.6; margin-top: 0.2rem; text-align: right; }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .input-panel {
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            gap: 0.6rem;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        .icon-button {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 40px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .icon-button:hover { background: rgba(255,255,255,0.6); transform: scale(1.02); }
        .text-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 40px;
            padding: 0.7rem 1rem;
            font-size: 0.9rem;
            outline: none;
        }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }
        .modal-bottom {
            background: #d4e8fc;
            width: 100%;
            border-radius: 32px 32px 0 0;
            padding: 1.5rem;
            max-height: 70vh;
            overflow-y: auto;
        }
        .sticker-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }
        .sticker-img {
            width: 90px;
            cursor: pointer;
            transition: 0.1s;
            background: white;
            border-radius: 20px;
            padding: 0.3rem;
        }
        .sticker-img:hover { transform: scale(1.05); }
        .close-btn {
            background: #0a3f6f;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            margin-top: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-main-container" id="chatContainer">
    <!-- Левая панель -->
    <div class="members-panel">
        <div class="members-header">👥 Участники 5А</div>
        <ul class="members-list" id="membersList"></ul>
    </div>

    <!-- Правая зона -->
    <div class="chat-area">
        <div class="chat-header">
            <span class="chat-title">💬 Общий чат 5 «А»</span>
            <button class="settings-btn" id="settingsBtn">⚙️ Настройки</button>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="input-panel">
            <button class="icon-button" id="stickerBtn">😊</button>
            <input type="text" class="text-input" id="messageInput" placeholder="Сообщение...">
            <button class="icon-button" id="attachBtn">📎</button>
            <button class="icon-button" id="sendBtn">➤</button>
        </div>
    </div>
</div>

<!-- Модалка стикеров -->
<div id="stickerModal" class="modal">
    <div class="modal-bottom">
        <h3 style="text-align:center">Выбери стикер</h3>
        <div id="stickerList" class="sticker-grid"></div>
        <button class="close-btn" onclick="closeModal('stickerModal')">Закрыть</button>
    </div>
</div>

<!-- Модалка скрепки -->
<div id="attachModal" class="modal">
    <div class="modal-bottom">
        <h3 style="text-align:center">Отправить файл</h3>
        <div class="sticker-grid" style="grid-template-columns: repeat(3,1fr);">
            <div style="text-align:center"><div class="icon-button" style="font-size:2rem; width:70px; margin:0 auto;">📷</div><div>Фото</div></div>
            <div style="text-align:center"><div class="icon-button" style="font-size:2rem; width:70px; margin:0 auto;">🎥</div><div>Видео</div></div>
            <div style="text-align:center"><div class="icon-button" style="font-size:2rem; width:70px; margin:0 auto;">📄</div><div>Файл</div></div>
            <div style="text-align:center"><div class="icon-button" style="font-size:2rem; width:70px; margin:0 auto;">📊</div><div>Опрос</div></div>
            <div style="text-align:center"><div class="icon-button" style="font-size:2rem; width:70px; margin:0 auto;">🎤</div><div>Голос</div></div>
            <div style="text-align:center"><div class="icon-button" style="font-size:2rem; width:70px; margin:0 auto;">🔗</div><div>Ссылка</div></div>
        </div>
        <button class="close-btn" onclick="closeModal('attachModal')">Отмена</button>
    </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUser = null;
    let messagesUnsub = null;

    // Проверка авторизации
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        currentUser = user;
        // Статус онлайн
        await db.collection('status').doc(user.uid).set({ online: true, name: user.displayName || 'Ученик' }, { merge: true });
        loadMessages();
        loadMembers();
        // При уходе со страницы — офлайн
        window.addEventListener('beforeunload', () => {
            db.collection('status').doc(user.uid).set({ online: false }, { merge: true });
        });
    });

    function loadMessages() {
        if (messagesUnsub) messagesUnsub();
        messagesUnsub = db.collection('rooms').doc('class5a').collection('messages')
            .orderBy('createdAt')
            .onSnapshot(snap => {
                const container = document.getElementById('messagesArea');
                container.innerHTML = '';
                snap.forEach(doc => {
                    const m = doc.data();
                    const mine = m.uid === currentUser?.uid;
                    const div = document.createElement('div');
                    div.className = `message ${mine ? 'mine' : ''}`;
                    div.innerHTML = `
                        <div class="msg-avatar">${(m.name?.charAt(0) || '?')}</div>
                        <div class="msg-bubble">
                            <div class="msg-name">${m.name || 'Ученик'}</div>
                            <div class="msg-text">${m.sticker ? `<img src="${m.sticker}" style="max-width:130px">` : (m.text || '')}</div>
                            <div class="msg-time">${m.createdAt?.toDate().toLocaleTimeString() || ''}</div>
                        </div>
                    `;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
    }

    async function loadMembers() {
        const membersList = document.getElementById('membersList');
        db.collection('status').onSnapshot(snap => {
            membersList.innerHTML = '';
            snap.forEach(doc => {
                const m = doc.data();
                membersList.innerHTML += `
                    <li class="member-item">
                        <div class="member-avatar">${(m.name?.charAt(0) || '?')}</div>
                        <div class="member-info">
                            <div class="member-name">${m.name || 'Ученик'}</div>
                            <div class="member-status ${m.online ? 'online-status' : 'offline-status'}">${m.online ? '🟢 Онлайн' : '⚫ Офлайн'}</div>
                        </div>
                    </li>
                `;
            });
        });
    }

    async function sendMessage(text, stickerUrl = null) {
        if (!text.trim() && !stickerUrl) return;
        await db.collection('rooms').doc('class5a').collection('messages').add({
            text: text,
            sticker: stickerUrl,
            uid: currentUser.uid,
            name: currentUser.displayName || 'Ученик',
            createdAt: new Date()
        });
    }

    // Стикеры из папки /stickers/
    function loadStickers() {
        const stickers = ['stickers/okay.gif'];
        const container = document.getElementById('stickerList');
        container.innerHTML = stickers.map(s => `<img src="${s}" class="sticker-img" onclick="sendSticker('${s}')">`).join('');
    }
    window.sendSticker = (url) => {
        sendMessage('', url);
        closeModal('stickerModal');
    };
    window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    document.getElementById('stickerBtn').onclick = () => { loadStickers(); document.getElementById('stickerModal').style.display = 'flex'; };
    document.getElementById('attachBtn').onclick = () => document.getElementById('attachModal').style.display = 'flex';
    document.getElementById('sendBtn').onclick = () => {
        const inp = document.getElementById('messageInput');
        if (inp.value.trim()) sendMessage(inp.value);
        inp.value = '';
    };
    document.getElementById('settingsBtn').onclick = () => alert('⚙️ Настройки профиля будут в settings.html (скоро)');
</script>
</body>
</html>
