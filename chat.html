<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Чат 5А | Школа №15</title>
    <link rel="stylesheet" href="common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: url('images/fon.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }
        .chat-main-container {
            width: 1400px;
            max-width: 98vw;
            height: 90vh;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .members-panel {
            width: 280px;
            background: rgba(10, 30, 50, 0.3);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .members-header { padding: 1.5rem 1rem; font-weight: bold; color: white; background: rgba(0, 0, 0, 0.2); font-size: 1.1rem; }
        .members-list { flex: 1; list-style: none; padding: 0.5rem; }
        .member-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 0.5rem;
        }
        .member-avatar {
            width: 44px;
            height: 44px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        .member-info { flex: 1; }
        .member-name { font-weight: 600; color: white; font-size: 0.9rem; }
        .member-status { font-size: 0.7rem; opacity: 0.8; }
        .online-status { color: #4ade80; }
        .offline-status { color: #9ca3af; }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .chat-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .chat-title { font-weight: bold; color: white; font-size: 1.1rem; }
        .settings-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            scroll-behavior: smooth;
        }
        .date-divider { text-align: center; margin: 1rem 0; }
        .date-badge {
            display: inline-block;
            background: rgba(100, 100, 120, 0.7);
            backdrop-filter: blur(8px);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #e0e0e0;
            font-weight: 500;
        }
        .message {
            display: flex;
            gap: 0.6rem;
            align-items: flex-start;
            max-width: 85%;
            position: relative;
            transition: box-shadow 0.4s ease;
            border-radius: 20px;
            padding: 0.1rem 0;
        }
        .message.highlight {
            animation: megaGlow 0.8s ease-out forwards;
        }
        @keyframes megaGlow {
            0% { filter: drop-shadow(0 0 0px rgba(255, 215, 0, 0)) drop-shadow(0 0 0px rgba(0, 200, 255, 0)); background: transparent; }
            20% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.9)) drop-shadow(0 0 25px rgba(0, 200, 255, 0.8)); background: rgba(255, 215, 0, 0.15); }
            40% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 1)) drop-shadow(0 0 35px rgba(0, 200, 255, 0.9)); background: rgba(255, 215, 0, 0.25); }
            60% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.8)) drop-shadow(0 0 25px rgba(0, 200, 255, 0.7)); background: rgba(255, 215, 0, 0.15); }
            100% { filter: drop-shadow(0 0 0px rgba(255, 215, 0, 0)) drop-shadow(0 0 0px rgba(0, 200, 255, 0)); background: transparent; }
        }
        .message.mine {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-avatar {
            width: 32px;
            height: 32px;
            background: #0a3f6f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.7rem;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }
        .msg-bubble {
            background: rgba(255, 255, 255, 0.9);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            color: #1e2f3e;
            position: relative;
        }
        .message.mine .msg-bubble {
            background: #0a3f6f;
            color: white;
        }
        .reply-preview {
            background: rgba(0, 0, 0, 0.08);
            border-left: 3px solid #e94560;
            padding: 0.3rem 0.6rem;
            margin-bottom: 0.4rem;
            border-radius: 12px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .reply-preview:hover { background: rgba(0, 0, 0, 0.15); }
        .message.mine .reply-preview {
            background: rgba(255, 255, 255, 0.15);
            border-left-color: #ffaa00;
        }
        .reply-author { font-weight: bold; opacity: 0.8; font-size: 0.65rem; }
        .reply-text { opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .msg-name { font-size: 0.65rem; font-weight: bold; margin-bottom: 0.2rem; }
        .msg-text { font-size: 0.9rem; }
        .msg-text img {
            max-width: 200px;
            max-height: 200px;
            width: auto;
            height: auto;
            border-radius: 16px;
            margin-top: 0.3rem;
            cursor: pointer;
        }
        .msg-text video {
            max-width: 280px;
            max-height: 200px;
            border-radius: 16px;
            margin-top: 0.3rem;
        }
        .msg-text iframe {
            max-width: 280px;
            border-radius: 16px;
            margin-top: 0.3rem;
        }
        .audio-player {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 40px;
            padding: 0.3rem 0.8rem;
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .audio-play-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .audio-wave {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 30px;
        }
        .audio-wave-bar {
            width: 3px;
            background: white;
            border-radius: 2px;
            transition: height 0.05s ease;
        }
        .audio-duration {
            font-size: 0.7rem;
            color: #ccc;
            margin-left: 0.5rem;
        }
        .poll-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 0.8rem;
            margin-top: 0.5rem;
        }
        .poll-title {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        .poll-option {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 0.5rem 0.8rem;
            margin: 0.3rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .poll-option:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.01); }
        .poll-option.correct { background: rgba(74, 222, 128, 0.3); border-left: 3px solid #4ade80; }
        .poll-option.wrong-selected { background: rgba(233, 69, 96, 0.3); border-left: 3px solid #e94560; }
        .poll-option.selected { background: rgba(74, 222, 128, 0.2); }
        .poll-option-count {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 40px;
            padding: 0.2rem 0.6rem;
            font-size: 0.7rem;
            color: #ccc;
        }
        .poll-total {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 0.5rem;
            text-align: right;
        }
        .poll-icon { margin-right: 0.5rem; }
        .poll-voters-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .msg-time { font-size: 0.6rem; opacity: 0.6; margin-top: 0.2rem; text-align: right; }
        .msg-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        .status-icons { display: flex; gap: 4px; font-size: 12px; }
        .delivered { color: #4ade80; }
        .sent { color: #9ca3af; }
        .progress-bar { font-size: 0.6rem; color: #ffaa00; margin-left: 4px; }
        .msg-actions { display: flex; gap: 6px; align-items: center; }
        .delete-btn { background: none; border: none; cursor: pointer; font-size: 14px; color: #ccc; }
        .delete-btn:hover { color: #e94560; }
        .seen-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: #ccc; }
        .seen-btn:hover { color: #fff; }
        
        .input-panel {
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 30;
        }
        .reply-bar {
            display: none;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 28px;
            padding: 0.4rem 0.8rem;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #ddd;
        }
        .reply-bar.active { display: flex; }
        .reply-bar .reply-content { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .reply-bar .cancel-reply {
            background: #e94560;
            border: none;
            color: white;
            border-radius: 40px;
            padding: 0.2rem 0.6rem;
            cursor: pointer;
        }
        .input-row {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            position: relative;
        }
        .icon-button {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 40px;
            font-size: 1.3rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .text-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 40px;
            padding: 0.7rem 1rem;
            font-size: 0.9rem;
            outline: none;
            color: #000 !important;
        }
        .text-input::placeholder { color: #555; }

        .audio-recorder-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease, backdrop-filter 0.3s ease;
            pointer-events: none;
        }
        .audio-recorder-overlay.active {
            display: flex;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            pointer-events: auto;
        }
        .recorder-container {
            text-align: center;
            padding: 2rem;
            border-radius: 60px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            animation: fadeInUp 0.2s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .waveform {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            height: 100px;
            margin-bottom: 1rem;
        }
        .waveform-bar {
            width: 5px;
            background: #4ade80;
            border-radius: 3px;
            transition: height 0.05s ease;
            box-shadow: 0 0 10px #4ade80;
        }
        .recorder-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 1rem 2rem;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .recorder-btn.recording {
            background: #e94560;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }
        .recorder-timer {
            font-size: 2rem;
            color: white;
            margin-bottom: 1rem;
            font-family: monospace;
            letter-spacing: 2px;
        }
        .audio-preview {
            display: none;
            align-items: center;
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 40px;
            padding: 0.3rem 0.8rem;
            margin-right: 0.5rem;
        }
        .audio-preview.active {
            display: flex;
        }
        .audio-preview-play {
            background: none;
            border: none;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        .audio-preview-wave {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 24px;
        }
        .audio-preview-wave-bar {
            width: 3px;
            background: #4ade80;
            border-radius: 1px;
        }
        .audio-preview-delete {
            background: none;
            border: none;
            color: #e94560;
            cursor: pointer;
            font-size: 1rem;
        }
        .context-menu {
            position: fixed;
            background: rgba(30, 40, 50, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 0.5rem;
            display: flex;
            gap: 0.5rem;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .context-menu button {
            background: rgba(255,255,255,0.15);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .context-menu button:hover { background: rgba(255,255,255,0.3); }
        .media-viewer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease, backdrop-filter 0.3s ease;
        }
        .media-viewer.active {
            display: flex;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
        }
        .media-viewer-content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
            transform: scale(0.8);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), opacity 0.25s ease;
        }
        .media-viewer.active .media-viewer-content {
            transform: scale(1);
            opacity: 1;
        }
        .media-viewer-content img, .media-viewer-content video {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 20px;
        }
        .media-viewer-close {
            position: absolute;
            top: -50px;
            right: 0;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .delete-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            transition: background 0.3s ease, backdrop-filter 0.3s ease;
        }
        .delete-modal-overlay.active {
            display: flex;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
        }
        .delete-modal {
            background: rgba(30, 40, 50, 0.96);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            max-width: 400px;
            width: 85%;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: slideUp 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .delete-modal p {
            color: white;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        .delete-content-preview {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 0.8rem;
            margin: 1rem 0;
            max-height: 150px;
            overflow-y: auto;
            color: #ddd;
            font-size: 0.85rem;
            text-align: left;
        }
        .delete-content-preview img {
            max-width: 100px;
            border-radius: 12px;
        }
        .delete-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .delete-buttons button {
            background: rgba(255,255,255,0.15);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .delete-buttons button:hover { background: rgba(255,255,255,0.3); transform: scale(1.02); }
        .delete-buttons button.confirm { background: #e94560; }
        .delete-buttons button.confirm:hover { background: #ff5a7a; }
        .modal-sheet {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            background: rgba(30, 47, 62, 0.96);
            backdrop-filter: blur(20px);
            border-radius: 28px 28px 0 0;
            max-width: 500px;
            margin: 0 auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), opacity 0.2s ease;
            border-top: 1px solid rgba(255,255,255,0.2);
            z-index: 25;
            display: none;
            opacity: 0;
        }
        .modal-sheet.active {
            display: block;
            transform: translateY(0);
            opacity: 1;
        }
        .modal-handle {
            width: 50px;
            height: 5px;
            background: #7f8c8d;
            border-radius: 10px;
            margin: 12px auto 8px;
            cursor: grab;
        }
        .modal-handle:active { cursor: grabbing; }
        .modal-content-inner { padding: 0 1rem 1.5rem; max-height: 55vh; overflow-y: auto; }
        .modal-title { text-align: center; color: #e0e0e0; font-size: 0.9rem; font-weight: 500; margin-bottom: 1rem; }
        .close-btn {
            background: #0a3f6f;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            margin-top: 1rem;
            cursor: pointer;
            width: 100%;
        }
        .sticker-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }
        .sticker-img {
            width: 85px;
            cursor: pointer;
            background: white;
            border-radius: 20px;
            padding: 0.3rem;
        }
        .attach-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
        }
        .attach-item {
            text-align: center;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 0.8rem 0.5rem;
        }
        .attach-icon { font-size: 2rem; filter: grayscale(100%); opacity: 0.7; }
        .attach-label { font-size: 0.7rem; color: #e0e0e0; margin-top: 0.3rem; }
        .camera-actions { display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1rem; }
        .full-width-btn {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 40px;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            color: white;
            cursor: pointer;
            text-align: center;
        }
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .photo-item {
            position: relative;
            cursor: pointer;
        }
        .photo-item img, .photo-item video {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 16px;
        }
        .photo-number {
            position: absolute;
            top: 5px;
            left: 5px;
            background: #e94560;
            color: white;
            border-radius: 20px;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }
        .video-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0,0,0,0.6);
            color: white;
            border-radius: 20px;
            padding: 2px 6px;
            font-size: 0.6rem;

<script>
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUser = null, messagesUnsub = null, CHAT_PATH = 'class5a_chat', usersCache = new Map();
    let selectedMedia = [], attachScreen = 'main', pendingMessages = new Map(), pendingDeleteId = null;
    let onlineInterval = null, replyToMsg = null, contextMenu = null;
    let mediaRecorder = null, audioChunks = [], isRecording = false, recordingStartTime = null, audioTimer = null, audioData = null, audioWaveInterval = null, audioContext = null, audioSource = null, audioAnalyser = null;
    let pollData = { title: '', options: [''], correctOption: null };
    
    function formatDateLabel(d) { const n=new Date(), t=new Date(n.getFullYear(),n.getMonth(),n.getDate()), y=new Date(t); y.setDate(y.getDate()-1); const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()); if(m.getTime()===t.getTime()) return'Сегодня'; if(m.getTime()===y.getTime()) return'Вчера'; return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'}); }

    async function getUserData(uid){ if(usersCache.has(uid)) return usersCache.get(uid); const doc=await db.collection('users').doc(uid).get(); const data=doc.data()||{name:'Ученик',avatarBase64:null}; usersCache.set(uid,data); return data; }
    auth.onAuthStateChanged(async(user)=>{ if(!user){ window.location.href='login.html'; return; } currentUser=user; if(onlineInterval) clearInterval(onlineInterval); const updateStatus=async()=>{ await db.collection('status').doc(user.uid).set({online:true,name:user.displayName||'Ученик',lastSeen:newDate()},{merge:true}); }; await updateStatus(); onlineInterval=setInterval(updateStatus,30000); loadMessages(); loadMembers(); window.addEventListener('beforeunload',()=>{ clearInterval(onlineInterval); db.collection('status').doc(user.uid).set({online:false,lastSeen:newDate()},{merge:true}); }); });
    async function markAsSeen(msgId){ await db.collection('rooms').doc(CHAT_PATH).collection('messages').doc(msgId).update({seenBy:firebase.firestore.FieldValue.arrayUnion(currentUser.uid)}); }
    function closeModal(sId){ let s=document.getElementById(sId); if(!s) return; s.classList.remove('active'); setTimeout(()=>{ s.style.display='none'; },300); }
    function openModal(sId){ let s=document.getElementById(sId); if(!s) return; s.style.display='block'; setTimeout(()=>s.classList.add('active'),10); }
    function initSwipeClose(sId,hId){ let s=document.getElementById(sId),h=document.getElementById(hId); if(!s||!h) return; let sy=0,st=0,drag=false; h.addEventListener('touchstart',e=>{ sy=e.touches[0].clientY; const tr=s.style.transform; if(tr&&tr.includes('translateY')) st=parseFloat(tr.match(/translateY\(([-\d]+)px\)/)?.[1]||0); drag=true; }); h.addEventListener('touchmove',e=>{ if(!drag) return; const d=e.touches[0].clientY-sy; if(d>0) s.style.transform=`translateY(${st+d}px)`; }); h.addEventListener('touchend',e=>{ if(!drag) return; const d=e.changedTouches[0].clientY-sy; if(d>60) closeModal(sId); s.style.transform=''; drag=false; }); let md=false,msy=0; h.addEventListener('mousedown',e=>{ md=true; msy=e.clientY; e.preventDefault(); }); window.addEventListener('mousemove',e=>{ if(!md) return; const d=e.clientY-msy; if(d>0) s.style.transform=`translateY(${d}px)`; }); window.addEventListener('mouseup',e=>{ if(!md) return; const d=e.clientY-msy; if(d>60) closeModal(sId); s.style.transform=''; md=false; }); }
    function scrollToMessage(msgId){ let el=document.getElementById(msgId); if(!el) return; el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('highlight'); setTimeout(()=>el.classList.remove('highlight'),1000); }
    function showMediaViewer(url,type,ev){ let v=document.getElementById('mediaViewer'),img=document.getElementById('mediaViewerImg'),vid=document.getElementById('mediaViewerVideo'),c=document.querySelector('.media-viewer-content'); let rect=ev&&ev.target?ev.target.getBoundingClientRect():null; img.style.display='none'; vid.style.display='none'; if(type==='image'){ img.src=url; img.style.display='block'; }else{ vid.src=url; vid.style.display='block'; vid.load(); } v.classList.add('active'); if(rect){ c.style.transform=`translate(${rect.left+rect.width/2-window.innerWidth/2}px, ${rect.top+rect.height/2-window.innerHeight/2}px) scale(${rect.width/300})`; c.style.opacity='0'; setTimeout(()=>{ c.style.transform=''; c.style.opacity=''; },10); } }
    function closeMediaViewer(){ let v=document.getElementById('mediaViewer'),vid=document.getElementById('mediaViewerVideo'),c=document.querySelector('.media-viewer-content'); c.style.transform='scale(0.8)'; c.style.opacity='0'; setTimeout(()=>{ v.classList.remove('active'); vid.pause(); vid.src=''; c.style.transform=''; c.style.opacity=''; },250); }
    function showContextMenu(x,y,d){ if(contextMenu) contextMenu.remove(); contextMenu=document.createElement('div'); contextMenu.className='context-menu'; contextMenu.style.left=x+'px'; contextMenu.style.top=(y+45)+'px'; let rb=document.createElement('button'); rb.innerHTML='💬 Ответить'; rb.onclick=()=>{ showReplyBar(d); contextMenu.remove(); contextMenu=null; }; let cb=document.createElement('button'); cb.innerHTML='📋 Копировать'; cb.onclick=()=>{ let txt=d.text||''; if(d.images?.length) txt=`📷 ${d.images.length} фото`; if(d.videos?.length) txt=`🎥 ${d.videos.length} видео`; if(d.audio) txt='🎤 Голосовое'; if(d.sticker) txt='😊 Стикер'; if(d.type==='poll') txt=`📊 Опрос: ${d.title}`; navigator.clipboard.writeText(txt); let t=document.createElement('div'); t.textContent='✅ Скопировано!'; t.style.cssText='position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); color:white; padding:0.5rem 1rem; border-radius:40px; font-size:0.8rem; z-index:1001;'; document.body.appendChild(t); setTimeout(()=>t.remove(),1500); contextMenu.remove(); contextMenu=null; }; contextMenu.appendChild(rb); contextMenu.appendChild(cb); document.body.appendChild(contextMenu); let ch=()=>{ if(!contextMenu?.contains(e.target)){ contextMenu?.remove(); contextMenu=null; document.removeEventListener('click',ch); document.removeEventListener('contextmenu',ch); } }; setTimeout(()=>{ document.addEventListener('click',ch); document.addEventListener('contextmenu',ch); },10); }
    function showReplyBar(msg){ replyToMsg=msg; let rb=document.getElementById('replyBar'),rc=document.getElementById('replyContent'); let pt=msg.text||''; if(msg.images?.length) pt=`📷 ${msg.images.length} фото`; if(msg.videos?.length) pt=`🎥 ${msg.videos.length} видео`; if(msg.audio) pt='🎤 Голосовое'; if(msg.sticker) pt='😊 Стикер'; if(msg.type==='poll') pt=`📊 Опрос: ${msg.title}`; rc.innerHTML=`<strong>${msg.name||'Ученик'}</strong>: ${pt.substring(0,50)}`; rb.classList.add('active'); document.getElementById('messageInput').focus(); }
    function cancelReply(){ replyToMsg=null; document.getElementById('replyBar').classList.remove('active'); }
    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    function showDeleteModal(id,html){ pendingDeleteId=id; document.getElementById('deletePreview').innerHTML=html; document.getElementById('deleteModalOverlay').classList.add('active'); }
    function closeDeleteModal(){ document.getElementById('deleteModalOverlay').classList.remove('active'); pendingDeleteId=null; }
    async function confirmDelete(){ if(!pendingDeleteId) return; let docRef=db.collection('rooms').doc(CHAT_PATH).collection('messages').doc(pendingDeleteId); let doc=await docRef.get(); if(!doc.exists) return; let msg=doc.data(); let isMine=msg.uid===currentUser.uid; let can=isMine; if(!isMine){ let pwd=prompt('🔐 Это чужое сообщение. Введите пароль модератора:'); if(pwd==='КИКИ99СССР') can=true; else alert('Неверный пароль!'); } if(can) await docRef.delete(); closeDeleteModal(); }
    function startRecordingFromSheet(){ if(isRecording) return; navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{ audioContext=new AudioContext(); audioSource=audioContext.createMediaStreamSource(stream); audioAnalyser=audioContext.createAnalyser(); audioAnalyser.fftSize=256; audioSource.connect(audioAnalyser); mediaRecorder=new MediaRecorder(stream); audioChunks=[]; mediaRecorder.ondataavailable=e=>{ audioChunks.push(e.data); }; mediaRecorder.onstop=()=>{ let ab=new Blob(audioChunks,{type:'audio/webm'}); let r=new FileReader(); r.onload=()=>{ audioData=r.result; showAudioPreview(); }; r.readAsDataURL(ab); stream.getTracks().forEach(t=>t.stop()); if(audioContext) audioContext.close(); }; mediaRecorder.start(100); isRecording=true; recordingStartTime=Date.now(); let ov=document.getElementById('audioRecorderOverlay'),rb=document.getElementById('recorderBtn'),td=document.getElementById('recorderTimer'),wf=document.getElementById('waveform'); ov.classList.add('active'); rb.classList.add('recording'); rb.innerHTML='⏹ Отпустите для отправки'; if(audioTimer) clearInterval(audioTimer); audioTimer=setInterval(()=>{ let e=Math.floor((Date.now()-recordingStartTime)/1000),m=Math.floor(e/60),s=e%60; td.textContent=`${m}:${s.toString().padStart(2,'0')}`; },100); if(audioWaveInterval) clearInterval(audioWaveInterval); audioWaveInterval=setInterval(()=>{ if(!audioAnalyser||!isRecording) return; let da=new Uint8Array(audioAnalyser.frequencyBinCount); audioAnalyser.getByteFrequencyData(da); let avg=da.reduce((a,b)=>a+b,0)/da.length; wf.innerHTML=''; for(let i=0;i<40;i++){ let b=document.createElement('div'); b.className='waveform-bar'; let h=Math.max(10,Math.min(80,15+(avg/4)+Math.random()*15)); b.style.height=h+'px'; b.style.opacity=0.6+(avg/255)*0.4; wf.appendChild(b); } },50); }).catch(e=>{ console.error(e); alert('Нет доступа к микрофону'); }); }
    function stopRecordingFromSheet(){ if(!isRecording||!mediaRecorder) return; mediaRecorder.stop(); isRecording=false; if(audioTimer) clearInterval(audioTimer); if(audioWaveInterval) clearInterval(audioWaveInterval); let ov=document.getElementById('audioRecorderOverlay'),rb=document.getElementById('recorderBtn'); ov.classList.remove('active'); rb.classList.remove('recording'); rb.innerHTML='🎤 Удерживайте для записи'; document.getElementById('recorderTimer').textContent='0:00'; document.getElementById('waveform').innerHTML=''; if(attachScreen==='voice'){ attachScreen='main'; renderAttachMain(); } }
    function showAudioPreview(){ let pr=document.getElementById('audioPreview'),wc=document.getElementById('audioPreviewWave'); wc.innerHTML=''; for(let i=0;i<25;i++){ let b=document.createElement('div'); b.className='audio-preview-wave-bar'; b.style.height=(5+Math.random()*18)+'px'; wc.appendChild(b); } pr.classList.add('active'); let isPlaying=false,audio=null,pb=document.getElementById('audioPreviewPlay'); pb.onclick=()=>{ if(isPlaying&&audio){ audio.pause(); isPlaying=false; pb.textContent='▶️'; }else{ if(audio) audio.play(); else{ audio=new Audio(audioData); audio.onended=()=>{ isPlaying=false; pb.textContent='▶️'; }; audio.play(); } isPlaying=true; pb.textContent='⏸'; } }; document.getElementById('audioPreviewDelete').onclick=()=>{ if(audio) audio.pause(); audioData=null; pr.classList.remove('active'); }; }
    function getAudioPreviewData(){ return audioData; }
    function clearAudioPreview(){ audioData=null; document.getElementById('audioPreview').classList.remove('active'); }
    function createPoll(){ pollData={title:'',options:[''],correctOption:null}; renderPollCreator(); }
    function renderPollCreator(){ let c=document.getElementById('attachModalContent'); if(!c) return; let oh=''; for(let i=0;i<pollData.options.length;i++) oh+=`<div style="margin-bottom:0.5rem;"><input type="text" class="poll-option-input" data-index="${i}" value="${escapeHtml(pollData.options[i])}" placeholder="Вариант ответа ${i+1}" style="width:100%; padding:0.5rem; border-radius:40px; border:none; background:rgba(255,255,255,0.9);"></div>`; c.innerHTML=`<div class="modal-title">📊 Создать опрос</div><div style="margin-bottom:1rem;"><input type="text" id="pollTitle" value="${escapeHtml(pollData.title)}" placeholder="Заголовок опроса..." style="width:100%; padding:0.7rem; border-radius:40px; border:none; background:rgba(255,255,255,0.9);"></div><div id="pollOptionsContainer">${oh}</div><button id="addPollOptionBtn" class="full-width-btn" style="margin-bottom:0.5rem;">➕ Добавить вариант ответа</button><button id="setCorrectPollBtn" class="full-width-btn" style="margin-bottom:0.5rem; ${pollData.correctOption!==null?'background:#4ade80; color:#000;':''}">🎯 ${pollData.correctOption!==null?'Правильный ответ выбран':'Выбрать правильный ответ'}</button><div style="display:flex; gap:0.5rem; margin-top:1rem;"><button id="backFromPollBtn" class="close-btn" style="background:#555;">← Назад</button><button id="sendPollBtn" class="close-btn">📤 Отправить опрос</button></div>`; document.querySelectorAll('.poll-option-input').forEach(inp=>{ inp.addEventListener('change',()=>{ pollData.options[parseInt(inp.dataset.index)]=inp.value; }); }); document.getElementById('pollTitle').addEventListener('change',e=>{ pollData.title=e.target.value; }); document.getElementById('addPollOptionBtn').onclick=()=>{ pollData.options.push(''); renderPollCreator(); }; document.getElementById('setCorrectPollBtn').onclick=()=>{ if(pollData.correctOption!==null){ pollData.correctOption=null; renderPollCreator(); return; } c.innerHTML=`<div class="modal-title">🎯 Выберите правильный ответ</div>${pollData.options.map((opt,idx)=>`<div class="poll-option" data-opt-index="${idx}" style="background:rgba(255,255,255,0.1); margin:0.5rem 0; padding:0.7rem; border-radius:40px; cursor:pointer;">${escapeHtml(opt)}</div>`).join('')}<button id="cancelCorrectBtn" class="close-btn" style="background:#555; margin-top:1rem;">Отмена</button>`; document.querySelectorAll('[data-opt-index]').forEach(opt=>{ opt.onclick=()=>{ pollData.correctOption=parseInt(opt.dataset.optIndex); renderPollCreator(); }; }); document.getElementById('cancelCorrectBtn').onclick=()=>renderPollCreator(); }; document.getElementById('backFromPollBtn').onclick=()=>{ attachScreen='main'; renderAttachMain(); }; document.getElementById('sendPollBtn').onclick=async()=>{ if(!pollData.title.trim()){ alert('Введите заголовок опроса'); return; } let vo=pollData.options.filter(o=>o.trim()); if(vo.length<2){ alert('Добавьте минимум 2 варианта ответа'); return; } pollData.options=vo; await sendMessageOptimistic('',null,null,null,null,null,{type:'poll',title:pollData.title,options:pollData.options,correctOption:pollData.correctOption,votes:{}}); closeModal('attachSheet'); pollData={title:'',options:[''],correctOption:null}; }; }
    async function votePoll(pid,opt){ let pr=db.collection('rooms').doc(CHAT_PATH).collection('messages').doc(pid); let doc=await pr.get(); let p=doc.data(); if(!p||p.type!=='poll') return; let v=p.votes||{},uv=null; for(let [uid,oi] of Object.entries(v)) if(uid===currentUser.uid) uv=oi; if(uv===opt) return; if(uv!==null) delete v[currentUser.uid]; v[currentUser.uid]=opt; await pr.update({votes:v}); }

    document.getElementById('sendBtn').onclick=async()=>{ let txt=document.getElementById('messageInput').value,imgs=selectedMedia.filter(m=>m.type==='image').map(m=>m.data),vids=selectedMedia.filter(m=>m.type==='video').map(m=>m.data),aud=getAudioPreviewData(),dur=document.getElementById('recorderTimer')?.textContent||null; if(aud){ await sendMessageOptimistic(txt,imgs,vids,aud,dur); clearAudioPreview(); selectedMedia=[]; document.getElementById('messageInput').value=''; closeModal('attachSheet'); }else if(selectedMedia.length){ await sendMessageOptimistic(txt,imgs,vids); selectedMedia=[]; document.getElementById('messageInput').value=''; closeModal('attachSheet'); }else if(txt.trim()){ await sendMessageOptimistic(txt,null,null); document.getElementById('messageInput').value=''; } };
    document.getElementById('settingsBtn').onclick=()=>window.location.href='settings.html';
</script>
</body>
</html>
