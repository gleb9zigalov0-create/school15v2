<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5А — Расписание | Школа №15</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="theme-schedule.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body class="page-schedule">

<div class="deco" aria-hidden="true">
    <div class="slot s1"></div>
    <div class="slot s2"></div>
    <div class="slot s3"></div>
</div>

<div class="page-wrap">
    <div class="top-bar">
        <h1>📖 Расписание 5 «А»</h1>
        <span class="badge">Школа №15 · Тырган</span>
    </div>

    <div class="panel">
        <div class="day-switch" id="daySwitch"></div>
        <div id="scheduleContainer"></div>
        <div class="bottom-row">
            <a href="index.html" class="back-btn">← На главную</a>
            <button type="button" class="admin-btn" id="enterConstructorBtn">🔐 Войти в конструктор</button>
        </div>
        <p class="hint">📌 Нажми «Войти в конструктор» и введи пароль <strong>КИКИ99СССР</strong>, чтобы менять расписание</p>
    </div>

    <footer class="site-footer">🏫 Школа №15 | Микрорайон Тырган, Прокопьевск</footer>
</div>

<script src="js/firebase-config.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let scheduleData = {};
    let currentDay = 'ПН';
    let sortableInstance = null;
    let isConstructorMode = false;  // ← режим конструктора

    // Загрузка из Firebase
    async function loadSchedule() {
        const docRef = doc(db, "schedule", "5A");
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
            scheduleData = docSnap.data();
        } else {
            scheduleData = {
                'ПН': [
                    { time: '9:00-9:40', subject: 'Русский язык', homework: 'Упр. 145, стр. 78-79' },
                    { time: '9:50-10:30', subject: 'Математика', homework: '№ 567, 568' },
                    { time: '10:50-11:30', subject: 'Литература', homework: 'Прочитать главы 3-5' },
                    { time: '11:50-12:30', subject: 'Английский', homework: 'WB стр. 34-35' },
                    { time: '12:50-13:30', subject: 'История', homework: '§12 пересказ' }
                ],
                'ВТ': [
                    { time: '9:00-9:40', subject: 'Математика', homework: '№ 572, 574' },
                    { time: '9:50-10:30', subject: 'Русский язык', homework: 'Упр. 148' },
                    { time: '10:50-11:30', subject: 'Биология', homework: '§15, рисунок' },
                    { time: '11:50-12:30', subject: 'География', homework: 'Контурная карта' },
                    { time: '12:50-13:30', subject: 'Физкультура', homework: 'форма, кросс' }
                ],
                'СР': [
                    { time: '9:00-9:40', subject: 'Русский язык', homework: 'Упр. 152' },
                    { time: '9:50-10:30', subject: 'Математика', homework: '№ 579, 581' },
                    { time: '10:50-11:30', subject: 'ИЗО', homework: 'Нарисовать пейзаж' },
                    { time: '11:50-12:30', subject: 'Английский', homework: 'SB стр. 42-43' },
                    { time: '12:50-13:30', subject: 'ОДНКНР', homework: 'Сообщение о традициях' }
                ],
                'ЧТ': [
                    { time: '9:00-9:40', subject: 'Математика', homework: '№ 584, 586' },
                    { time: '9:50-10:30', subject: 'Литература', homework: 'Сочинение' },
                    { time: '10:50-11:30', subject: 'История', homework: '§13 таблица' },
                    { time: '11:50-12:30', subject: 'Технология', homework: 'доделать доску' },
                    { time: '12:50-13:30', subject: 'ОБЗР', homework: '§4, вопросы' }
                ],
                'ПТ': [
                    { time: '9:00-9:40', subject: 'Русский язык', homework: 'Упр. 156' },
                    { time: '9:50-10:30', subject: 'Математика', homework: 'Повторение № 590' },
                    { time: '10:50-11:30', subject: 'Музыка', homework: 'слушать классику' },
                    { time: '11:50-12:30', subject: 'Физкультура', homework: 'форма' },
                    { time: '12:50-13:30', subject: 'Английский', homework: 'WB стр. 36-37' }
                ],
                'СБ': [
                    { time: '9:00-9:40', subject: 'Математика', homework: '№ 595, 598' },
                    { time: '9:50-10:30', subject: 'Русский язык', homework: 'Тесты в РЭШ' },
                    { time: '10:50-11:30', subject: 'Классный час', homework: 'портфолио' }
                ]
            };
        }
        renderSchedule();
    }

    async function saveToFirebase() {
        await setDoc(doc(db, "schedule", "5A"), scheduleData);
        alert("✅ Расписание сохранено в Firebase!");
    }

    function renderSchedule() {
        const container = document.getElementById('scheduleContainer');
        const lessons = scheduleData[currentDay] || [];

        if (!lessons.length) {
            container.innerHTML = '<div class="schedule-card" style="text-align:center;padding:2rem">Нет уроков</div>';
            return;
        }

        if (isConstructorMode) {
            // Режим конструктора — редактируемые поля + удаление + добавление
            let html = '<div class="schedule-card" id="constructorList">';
            lessons.forEach((lesson, idx) => {
                html += `
                    <div class="lesson-item" data-idx="${idx}">
                        <div class="drag-handle" style="cursor:grab; margin-right:8px;">⋮⋮</div>
                        <input type="text" class="time-input" value="${lesson.time}" style="width:110px; border-radius:30px; padding:4px 8px; border:1px solid #ccc; margin-right:8px;">
                        <input type="text" class="subject-input" value="${lesson.subject}" style="width:140px; border-radius:30px; padding:4px 8px; border:1px solid #ccc; margin-right:8px;">
                        <input type="text" class="hw-input" value="${escapeHtml(lesson.homework)}" style="flex:1; border-radius:30px; padding:4px 8px; border:1px solid #ccc;">
                        <button class="del-lesson" data-idx="${idx}" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">🗑️</button>
                    </div>`;
            });
            html += `<button id="addLessonBtn" style="margin-top:12px; padding:8px 20px; border-radius:40px; background:#0a3f6f; color:white; border:none; cursor:pointer;">+ Добавить урок</button>`;
            container.innerHTML = html;

            // Сохранение изменений при вводе
            document.querySelectorAll('.time-input').forEach((input, i) => {
                input.addEventListener('change', (e) => { scheduleData[currentDay][i].time = e.target.value; });
            });
            document.querySelectorAll('.subject-input').forEach((input, i) => {
                input.addEventListener('change', (e) => { scheduleData[currentDay][i].subject = e.target.value; });
            });
            document.querySelectorAll('.hw-input').forEach((input, i) => {
                input.addEventListener('change', (e) => { scheduleData[currentDay][i].homework = e.target.value; });
            });
            document.querySelectorAll('.del-lesson').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    scheduleData[currentDay].splice(idx, 1);
                    renderSchedule();
                    initSortable();
                });
            });
            document.getElementById('addLessonBtn')?.addEventListener('click', () => {
                scheduleData[currentDay].push({ time: "12:00-12:45", subject: "Новый урок", homework: "" });
                renderSchedule();
                initSortable();
            });
            initSortable();
        } else {
            // Обычный режим — только просмотр
            let html = '<div class="schedule-card">';
            lessons.forEach(lesson => {
                html += `
                    <div class="lesson-item">
                        <div class="time-badge">${lesson.time}</div>
                        <div class="subject-name">${lesson.subject}</div>
                        <div class="hw-row"><div class="hw-text">${lesson.homework || '—'}</div></div>
                    </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }
    }

    function initSortable() {
        const container = document.getElementById('constructorList');
        if (!container) return;
        if (sortableInstance) sortableInstance.destroy();
        sortableInstance = new Sortable(container, {
            handle: '.drag-handle',
            animation: 200,
            onEnd: () => {
                const newOrder = [];
                document.querySelectorAll('.lesson-item').forEach(item => {
                    const idx = parseInt(item.dataset.idx);
                    if (!isNaN(idx)) newOrder.push(scheduleData[currentDay][idx]);
                });
                if (newOrder.length) scheduleData[currentDay] = newOrder;
                renderSchedule();
            }
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, (m) => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    function renderDayButtons() {
        const days = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'];
        const container = document.getElementById('daySwitch');
        container.innerHTML = days.map(d => `<button class="day-btn${currentDay === d ? ' active' : ''}" data-day="${d}">${d}</button>`).join('');
        document.querySelectorAll('.day-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentDay = btn.dataset.day;
                renderDayButtons();
                renderSchedule();
            });
        });
    }

    // Вход в конструктор по паролю
    document.getElementById('enterConstructorBtn').addEventListener('click', async () => {
        if (!isConstructorMode) {
            const pwd = prompt("🔐 Введите пароль для входа в конструктор:");
            if (pwd !== "КИКИ99СССР") {
                alert("Неверный пароль!");
                return;
            }
            isConstructorMode = true;
            document.getElementById('enterConstructorBtn').textContent = "💾 Выйти и сохранить";
            renderSchedule();
        } else {
            // Выход из конструктора — сохраняем
            await saveToFirebase();
            isConstructorMode = false;
            document.getElementById('enterConstructorBtn').textContent = "🔐 Войти в конструктор";
            renderSchedule();
        }
    });

    renderDayButtons();
    loadSchedule();
</script>
</body>
</html>
